name: tests

# King's Gambit (in KingsGambit/):
#   lua      the engine's test suite (pure Lua, no game needed). On a pull request it also fails if the committed
#            simulator page is out of date.
#   page     builds the simulator page, syntax-checks its JavaScript, and plays every lesson in headless Chromium.
#   publish  on a push to main, once both pass: rebuilds the simulator page and, if the committed copies differ,
#            commits them back ("[skip ci]") and asks GitHub Pages to rebuild. So a fix to the engine or the page
#            goes live without anyone running the build by hand. Pull requests never publish.
on:
  push:
    branches: [main]
    paths:
      - 'KingsGambit/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'KingsGambit/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KingsGambit
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run the test suite
        run: lua5.4 tests/run.lua

      - name: Simulator page is up to date (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          lua5.4 scripts/build-simulator.lua
          git diff --exit-code --stat simulator/index.html ../docs/kings-gambit/index.html || {
            echo "::error::the simulator page (simulator/index.html, and the published copy docs/kings-gambit/index.html) is out of date. Run, in KingsGambit/: lua scripts/build-simulator.lua"
            exit 1
          }

  page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KingsGambit
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Build the simulator page from the sources
        run: lua5.4 scripts/build-simulator.lua

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: The page's JavaScript parses
        run: node scripts/check-simulator.mjs simulator/index.html

      - name: Install a headless browser
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Play every lesson in the page
        run: node simulator/test/smoke.mjs simulator/index.html

  publish:
    needs: [lua, page]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    concurrency:
      group: publish-simulator
      cancel-in-progress: false
    defaults:
      run:
        working-directory: KingsGambit
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Rebuild the simulator page and publish it if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lua5.4 scripts/build-simulator.lua
          if git diff --quiet -- simulator/index.html ../docs/kings-gambit/index.html; then
            echo "The committed simulator page is already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulator/index.html ../docs/kings-gambit/index.html
          git commit -m "chore: rebuild the simulator page from its sources [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          # a push made with the workflow's own token doesn't start a Pages build by itself: ask for one
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
          echo "Rebuilt, pushed and asked Pages to redeploy."
