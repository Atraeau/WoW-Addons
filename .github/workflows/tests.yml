name: tests

# Runs the King's Gambit test suite (pure Lua, no game needed) and checks that the committed
# browser simulator matches its sources. Read-only: it never commits anything.
on:
  push:
    branches: [main]
    paths:
      - 'src/KingsGambit/**'
      - 'tests/**'
      - 'simulator/**'
      - 'scripts/build-simulator.lua'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'src/KingsGambit/**'
      - 'tests/**'
      - 'simulator/**'
      - 'scripts/build-simulator.lua'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run the test suite
        run: lua5.4 tests/kings-gambit/run.lua

      - name: Simulator page is up to date
        run: |
          lua5.4 scripts/build-simulator.lua
          git diff --exit-code --stat simulator/index.html || {
            echo "::error::simulator/index.html is out of date. Run: lua scripts/build-simulator.lua"
            exit 1
          }
