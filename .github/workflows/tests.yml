name: tests

# Runs the King's Gambit test suite (pure Lua, no game needed, from KingsGambit/) and checks that the committed
# browser simulator matches its sources. Read-only: it never commits anything.
on:
  push:
    branches: [main]
    paths:
      - 'KingsGambit/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'KingsGambit/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KingsGambit
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run the test suite
        run: lua5.4 tests/run.lua

      - name: Simulator page is up to date
        run: |
          lua5.4 scripts/build-simulator.lua
          git diff --exit-code --stat simulator/index.html ../docs/kings-gambit/index.html || {
            echo "::error::the simulator page (simulator/index.html, and the published copy docs/kings-gambit/index.html) is out of date. Run, in KingsGambit/: lua scripts/build-simulator.lua"
            exit 1
          }
