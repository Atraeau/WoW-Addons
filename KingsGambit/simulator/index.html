-- ===== Loot.lua =====
do local chunk = function(...)
-- King's Gambit: the loot session and draft engine (Phase 4).
-- Pure logic over an Engine and its Client: no WoW calls, no frames. A Session takes a
-- batch of items through bidding, the tiered priority draft, the backstop and the
-- disenchant floor, then (after confirmation) hands the items out and records the results
-- in the ledger. Rules: docs/rationale.md.
--
--   bidding  -> main draft -> off-spec draft -> backstop -> disenchant -> review -> done
--
-- The draft works on scratch copies of the standings, so picks can be made live while
-- nothing is written to the ledger until confirm(). Winners drop to the bottom of the
-- scratch order exactly as the ledger will replay them.
local _, SK = ...
local Tokens, ItemFit
local M = SK:NewModule("Loot", { "ItemFit", "Tokens?" }, function(d) Tokens, ItemFit = d.Tokens, d.ItemFit end)

local DEFAULTS = {
    listId = "main",
    offListId = "off",
    bidSeconds = 30,     -- 0 = open-ended: the Master Looter calls resolveNow()
    pickSeconds = 20,    -- a draft turn that times out counts as a skip
    claimSeconds = 10,   -- a backstop offer that times out counts as a decline
    autoEnroll = true,   -- unlisted raiders are added to the bottom of the main list
    deHandler = nil,     -- who disenchants when nobody wants an item (default: this client)
}

local Session = {}
Session.__index = Session

local function copy(t)
    local out = {}
    for i, v in ipairs(t) do out[i] = v end
    return out
end

local function indexOf(t, v)
    for i = 1, #t do
        if t[i] == v then return i end
    end
end

local function moveToBottom(order, name)
    local i = indexOf(order, name)
    if i then table.remove(order, i); order[#order + 1] = name end
end

-- opts overrides DEFAULTS (see above).
function M.NewSession(engine, opts)
    local cfg = {}
    for k, v in pairs(DEFAULTS) do cfg[k] = v end
    for k, v in pairs(opts or {}) do cfg[k] = v end
    return setmetatable({
        engine = engine, client = engine.client, cfg = cfg, phase = "idle",
        items = {}, eligible = {}, eligibleList = {}, class = {},
        bids = {}, pending = {}, order = {}, skipped = { main = {}, off = {} },
        handlers = {}, turn = nil, timer = nil, deadline = nil,
    }, Session)
end

---------------------------------------------------------------- events
-- Events: phase {phase}, bid {player, item, kind}, turn {turn}, pending {action}, done {failures}
function Session:on(event, fn)
    local list = self.handlers[event]
    if not list then list = {}; self.handlers[event] = list end
    local entry = { fn = fn, active = true }
    list[#list + 1] = entry
    return function() entry.active = false end
end

function Session:emit(event, payload)
    for _, e in ipairs(copy(self.handlers[event] or {})) do
        if e.active then e.fn(payload) end
    end
end

local function norm(self, name) return self.client:normalize(name) end

---------------------------------------------------------------- timers
function Session:clearTimer()
    if self.timer then self.client:cancel(self.timer); self.timer = nil end
end

function Session:armTimer(sec, fn)
    self:clearTimer()
    if sec and sec > 0 then
        self.deadline = self.client:now() + sec
        self.timer = self.client:after(sec, function() self.timer = nil; fn() end)
    else
        self.deadline = nil
    end
end

---------------------------------------------------------------- start and bidding
-- items: array of { link, slot (loot slot, optional) }. Returns true, or false + reason.
function Session:start(items)
    if self.phase ~= "idle" then return false, "started" end
    local cfg = self.cfg
    local main = self.engine:Get(cfg.listId)
    if not main then return false, "nolist" end
    if #items == 0 then return false, "noitems" end

    -- When the loot became visible: each item may say (loot held for a later hand-out); default now. Events
    -- the session writes carry it as `seen`, so the ledger orders them by drop time, not hand-out time.
    local now = self.client:serverTime()
    self.seen = now
    for _, it in ipairs(items) do
        local s = tonumber(it.seen)
        if s and s <= now and s < self.seen then self.seen = s end
    end
    for _, m in ipairs(self.client:roster()) do
        if m.online then
            self.class[m.name] = m.class
            local mem = main.state.members[m.name]
            if not (mem and mem.active) and cfg.autoEnroll then
                self.engine:Append(cfg.listId, "AddMember", { member = m.name, class = m.class, seen = self.seen })
                mem = main.state.members[m.name]
            end
            if mem and mem.active then
                self.eligible[m.name] = true
                self.eligibleList[#self.eligibleList + 1] = m.name
            end
        end
    end

    for i, it in ipairs(items) do
        if type(it.link) ~= "string" or it.link == "" then return false, "badlink" end
        local s = tonumber(it.seen)
        if not (s and s <= now) then s = now end
        self.items[i] = { id = i, link = it.link, slot = it.slot, status = "open", seen = s,
            token = Tokens and Tokens.Find(it.link) or nil }
        self:fitOf(i)
    end
    self.order.main = copy(main.state.order)
    self.phase = "bidding"
    self:armTimer(cfg.bidSeconds, function() self:closeBidding() end)
    self:emit("phase", { phase = "bidding" })
    return true
end

-- What the session knows about item i (ItemFit's view: class restriction, stats), or nil while the game
-- hasn't cached it. Asked again until known: an uncached item restricts nobody.
function Session:fitOf(i)
    local it = self.items[i]
    if it and (not it.fit or it.fit.partial) then
        -- the guild's rule for this item, set ahead of time by an officer, decides who may bid
        it.fit = ItemFit.Describe(self.client, it.link, it.token, self.engine:ItemRule(ItemFit.ItemId(it.link))) or it.fit
    end
    return it and it.fit
end

-- kind: need | off | gift | pass. extra: { to = recipient (gift), passKind = "upgrade" (pass),
-- rank = 1, 2, ... (ranked choice: when a player wants several items, which they want most; 1 = most),
-- ready = "ready" | "says" | "notready" (tokens only: can they redeem it? A hint; never enforced) }.
function Session:bid(player, itemId, kind, extra)
    extra = extra or {}
    if self.phase ~= "bidding" then return false, "closed" end
    player = norm(self, player)
    if not self.eligible[player] then return false, "ineligible" end
    if not self.items[itemId] then return false, "noitem" end
    if not (kind == "need" or kind == "off" or kind == "gift" or kind == "pass") then return false, "badkind" end
    local to
    if kind == "gift" then
        to = norm(self, extra.to)
        if not to or to == player then return false, "badtarget" end
    end
    -- An item that names its classes is for those classes only, in the drafts (the backstop and the
    -- disenchanter are not restricted). Gifting doesn't get around it, in either direction.
    if kind ~= "pass" then
        local fit = self:fitOf(itemId)
        if not ItemFit.Allowed(fit, self.class[player]) then return false, "wrongclass" end
        if to and not ItemFit.Allowed(fit, self.class[to]) then return false, "wrongclassto" end
    end
    self.bids[player] = self.bids[player] or {}
    local rank = tonumber(extra.rank)
    if rank and (rank < 1 or rank ~= math.floor(rank)) then return false, "badrank" end
    local ready
    if self.items[itemId].token and kind ~= "pass" and Tokens and Tokens.STATES[extra.ready] then ready = extra.ready end
    self.bids[player][itemId] = { kind = kind, to = to, passKind = extra.passKind, rank = rank, ready = ready }
    self:emit("bid", { player = player, item = itemId, kind = kind })
    if self:allAnswered() then self:closeBidding() end
    return true
end

---------------------------------------------------------------- whisper fallback
-- Players without the addon answer by whispering the Master Looter. Accepted forms (case does
-- not matter; several answers can be joined with commas or semicolons):
--   "need"  "off"  "pass"  "gift Name"            (when there is only one item)
--   "1 need"  "need 1"  "#2 pass"  "2: off"  "1 gift Name"   (item number, either side)
--   "pass"                                         (several items: passes on all of them)
--   "1 need ready"                                 (a token: I have what it takes to turn it in)
local WORDS = { need = "need", n = "need", greed = "off", off = "off", os = "off", offspec = "off",
    ["off-spec"] = "off", pass = "pass", p = "pass", gift = "gift", g = "gift" }

-- Returns an array of { item, kind, to, ready } (item may be nil = "all items", only for pass), or
-- nil + a reason ("empty", "unclear", "needitem", "needtarget").
function M.ParseWhisper(text, itemCount)
    if type(text) ~= "string" then return nil, "empty" end
    local answers = {}
    for part in text:lower():gmatch("[^,;]+") do
        local words = {}
        for w in part:gmatch("[^%s]+") do words[#words + 1] = w end
        if #words > 0 then
            local item, kind, to, ready
            for _, w in ipairs(words) do
                local num = w:match("^#?(%d+):?$")
                if num and not item then item = tonumber(num)
                elseif w == "ready" and not ready then ready = true
                elseif WORDS[w] and not kind then kind = WORDS[w]
                elseif kind == "gift" and not to and w:match("^[%a%-']+$") then to = w
                else return nil, "unclear" end
            end
            if not kind then return nil, "unclear" end
            if kind == "gift" and not to then return nil, "needtarget" end
            if not item then
                if itemCount == 1 then item = 1
                elseif kind == "pass" then item = nil -- all items
                else return nil, "needitem" end
            end
            answers[#answers + 1] = { item = item, kind = kind, to = to, ready = ready }
        end
    end
    if #answers == 0 then return nil, "empty" end
    return answers
end

local WHISPER_HELP = "Whisper me one answer per item, e.g. '1 need', '2 off', '1 pass', '1 gift Name'. 'pass' alone passes on everything."

local function whisperProblem(reason)
    if reason == "needitem" then return "Which item? Put its number first, e.g. '1 need'." end
    if reason == "needtarget" then return "Who should get it? e.g. '1 gift Name'." end
    return "I didn't understand that. " .. WHISPER_HELP
end

-- Handle a whispered answer from `sender`. Replies by whisper. Returns the applied answers
-- or nil + reason.
function Session:handleWhisper(sender, text)
    local answers, why = M.ParseWhisper(text, #self.items)
    if not answers then
        self.client:whisper(sender, whisperProblem(why))
        return nil, why
    end
    local applied, lines = {}, {}
    local nextRank = 1 -- items wanted are ranked in the order they were written
    for _, a in ipairs(answers) do
        local ids = {}
        if a.item then ids[1] = a.item else for _, it in ipairs(self.items) do ids[#ids + 1] = it.id end end
        for _, id in ipairs(ids) do
            local rank
            if a.kind ~= "pass" then rank, nextRank = nextRank, nextRank + 1 end
            local ok, err = self:bid(sender, id, a.kind, { to = a.to, rank = rank, ready = a.ready and "says" or nil })
            if ok then
                applied[#applied + 1] = { item = id, kind = a.kind, to = a.to }
                lines[#lines + 1] = ("%s on item %d"):format(a.kind, id)
            else
                if err == "wrongclass" or err == "wrongclassto" then
                    lines[#lines + 1] = ("item %d is only for %s"):format(id, ItemFit.ClassList(self:fitOf(id)) or "other classes")
                else
                    lines[#lines + 1] = ("could not record item %d (%s)"):format(id, tostring(err))
                end
            end
        end
    end
    self.client:whisper(sender, "Got it: " .. table.concat(lines, "; ") .. ".")
    return applied
end

-- Tell the raid what is up for grabs and how to answer without the addon. One announcement
-- per item keeps each line under the chat limit. Returns the lines sent.
function Session:announce(channel)
    local lines = { "Loot: whisper me to answer (for example '1 need', '1 off', '1 pass')." }
    for _, it in ipairs(self.items) do lines[#lines + 1] = ("%d) %s"):format(it.id, it.link) end
    for _, line in ipairs(lines) do self.client:announce(line, channel or "RAID") end
    return lines
end

function Session:allAnswered()
    for _, p in ipairs(self.eligibleList) do
        for _, it in ipairs(self.items) do
            if not (self.bids[p] and self.bids[p][it.id]) then return false end
        end
    end
    return true
end

-- Public view of who has answered what, for the Master Looter panel.
function Session:answerCount()
    local answered = 0
    for _, p in ipairs(self.eligibleList) do
        local all = true
        for _, it in ipairs(self.items) do
            if not (self.bids[p] and self.bids[p][it.id]) then all = false end
        end
        if all then answered = answered + 1 end
    end
    return answered, #self.eligibleList
end

function Session:extend(sec)
    if self.phase ~= "bidding" or not self.deadline then return false end
    local remaining = self.deadline - self.client:now()
    self:armTimer(math.max(remaining, 0) + sec, function() self:closeBidding() end)
    return true
end

function Session:resolveNow()
    if self.phase ~= "bidding" then return false end
    self:closeBidding()
    return true
end

function Session:closeBidding()
    if self.phase ~= "bidding" then return end
    self:clearTimer()
    self:runDraft("main")
end

---------------------------------------------------------------- the draft
local function wants(bid, tier)
    if not bid then return false end
    if tier == "main" then return bid.kind == "need" or bid.kind == "gift" end
    return bid.kind == "off"
end

function Session:hasBid(player, itemId, tier)
    return wants(self.bids[player] and self.bids[player][itemId], tier)
end

-- The first player in scratch order with a live bid, plus the open items they bid on.
function Session:topCandidate(tier)
    for _, name in ipairs(self.order[tier]) do
        if self.eligible[name] and not self.skipped[tier][name] then
            local opts = {}
            for _, it in ipairs(self.items) do
                if it.status == "open" and self:hasBid(name, it.id, tier) then opts[#opts + 1] = it.id end
            end
            if #opts > 0 then return name, opts end
        end
    end
end

-- Lazy enrollment: off-spec bidders not yet on the off list join at its bottom.
function Session:buildOffOrder()
    local off = self.engine:Get(self.cfg.offListId)
    local order = off and copy(off.state.order) or {}
    local seen = {}
    for _, n in ipairs(order) do seen[n] = true end
    for _, name in ipairs(self.order.main) do
        if self.eligible[name] and not seen[name] then
            for _, it in ipairs(self.items) do
                if it.status == "open" and self:hasBid(name, it.id, "off") then
                    order[#order + 1] = name
                    seen[name] = true
                    self.pending[#self.pending + 1] = { type = "enroll", list = self.cfg.offListId, member = name }
                    break
                end
            end
        end
    end
    self.order.off = order
end

function Session:award(tier, who, itemId, toOverride)
    local it = self.items[itemId]
    local bid = self.bids[who] and self.bids[who][itemId]
    local to = toOverride or ((bid and bid.kind == "gift" and tier == "main") and bid.to or who)
    it.status, it.winner, it.to, it.tier = "awarded", who, to, tier
    local list = (tier == "off") and self.cfg.offListId or self.cfg.listId
    moveToBottom(self.order[tier == "off" and "off" or "main"], who)
    local action = { type = "award", list = list, member = who, to = to, item = it, tier = tier }
    self.pending[#self.pending + 1] = action
    self:emit("pending", action)
end

function Session:setTurn(turn, sec, onTimeout)
    self.turn = turn
    self:armTimer(sec, onTimeout)
    turn.deadline = self.deadline
    self:emit("turn", turn)
end

function Session:runDraft(tier)
    self.phase = tier
    if tier == "off" then self:buildOffOrder() end
    self:emit("phase", { phase = tier })
    self:continueDraft(tier)
end

function Session:continueDraft(tier)
    while true do
        local who, opts = self:topCandidate(tier)
        if not who then break end
        local ranked = self:rankedChoice(who, opts)
        if #opts == 1 then
            self:award(tier, who, opts[1])
        elseif ranked then
            self:award(tier, who, ranked) -- ranked choice: their most-wanted item still available
        else
            self:setTurn({ type = "pick", tier = tier, player = who, options = opts },
                self.cfg.pickSeconds, function() self:skip(who) end)
            return
        end
    end
    self.turn = nil
    self:clearTimer()
    if tier == "main" then self:runDraft("off") else self:runBackstop() end
end

-- Ranked choice: if the player ranked every option, the one they ranked highest (lowest number; ties go
-- to the lower item number). Otherwise nil, and they pick live.
function Session:rankedChoice(who, opts)
    local best, bestRank
    for _, id in ipairs(opts) do
        local b = self.bids[who] and self.bids[who][id]
        if not (b and b.rank) then return nil end
        if not bestRank or b.rank < bestRank or (b.rank == bestRank and id < best) then best, bestRank = id, b.rank end
    end
    return best
end

-- The player whose turn it is picks one of the items they bid on.
function Session:pick(player, itemId)
    local t = self.turn
    if not (t and t.type == "pick") then return false, "noturn" end
    player = norm(self, player)
    if player ~= t.player then return false, "notyourturn" end
    if not indexOf(t.options, itemId) then return false, "badpick" end
    self.turn = nil
    self:award(t.tier, player, itemId)
    self:continueDraft(t.tier)
    return true
end

-- Passing on a turn is always free; it forfeits the rest of this tier for that player.
function Session:skip(player)
    local t = self.turn
    if not (t and t.type == "pick") then return false, "noturn" end
    player = norm(self, player)
    if player ~= t.player then return false, "notyourturn" end
    self.turn = nil
    self.skipped[t.tier][player] = true
    self:continueDraft(t.tier)
    return true
end

---------------------------------------------------------------- backstop and disenchant
-- Items nobody drafted are offered lowest position first, with no usability gate.
function Session:runBackstop()
    self.phase = "backstop"
    self.queue = {}
    for _, it in ipairs(self.items) do
        if it.status == "open" then self.queue[#self.queue + 1] = it.id end
    end
    self.qi = 0
    self:emit("phase", { phase = "backstop" })
    self:nextBackstopItem()
end

function Session:nextBackstopItem()
    self.qi = self.qi + 1
    local id = self.queue[self.qi]
    if not id then return self:finish() end
    local players = {}
    for i = #self.order.main, 1, -1 do
        if self.eligible[self.order.main[i]] then players[#players + 1] = self.order.main[i] end
    end
    self.claim = { item = id, players = players, idx = 0 }
    self:offerNext()
end

function Session:offerNext()
    local c = self.claim
    c.idx = c.idx + 1
    local player = c.players[c.idx]
    if not player then
        self.items[c.item].status, self.items[c.item].tier = "de", "de"
        self.turn = nil
        return self:nextBackstopItem()
    end
    self:setTurn({ type = "claim", item = c.item, player = player },
        self.cfg.claimSeconds, function() self:decline(player) end)
end

-- extra.to (optional): hand the item to someone else, e.g. a bottom player proxying a
-- minor upgrade up to the player who can use it.
function Session:claimItem(player, extra)
    local t = self.turn
    if not (t and t.type == "claim") then return false, "noturn" end
    player = norm(self, player)
    if player ~= t.player then return false, "notyourturn" end
    local to
    if extra and extra.to then
        to = norm(self, extra.to)
        if not to or to == player then return false, "badtarget" end
    end
    self.turn = nil
    self:award("backstop", player, t.item, to)
    self:nextBackstopItem()
    return true
end

function Session:decline(player)
    local t = self.turn
    if not (t and t.type == "claim") then return false, "noturn" end
    player = norm(self, player)
    if player ~= t.player then return false, "notyourturn" end
    self:offerNext()
    return true
end

function Session:finish()
    self:clearTimer()
    self.turn = nil
    local handler = self.cfg.deHandler or self.client:me()
    for _, it in ipairs(self.items) do
        if it.status == "de" then
            self.pending[#self.pending + 1] = { type = "disenchant", list = self.cfg.listId, item = it, to = handler }
        end
    end
    -- Explicit passes that carry a kind (e.g. "upgrade") are recorded for the transparency stats.
    -- pairs() order is not stable, so collect and sort them before appending.
    local passes = {}
    for p, items in pairs(self.bids) do
        for itemId, b in pairs(items) do
            if b.kind == "pass" and b.passKind then
                passes[#passes + 1] = { type = "pass", list = self.cfg.listId, member = p,
                    item = self.items[itemId], kind = b.passKind }
            end
        end
    end
    table.sort(passes, function(x, y)
        if x.member ~= y.member then return x.member < y.member end
        return x.item.id < y.item.id
    end)
    for _, p in ipairs(passes) do self.pending[#self.pending + 1] = p end
    self.phase = "review"
    self:emit("phase", { phase = "review" })
end

---------------------------------------------------------------- confirm and distribute
-- Hand the items out and write the results to the ledger. Items from a loot window are given
-- first (GiveMasterLoot); the ledger entry is only written if that succeeded, so a failed
-- hand-out never leaves a phantom win. Returns true, failures (array of {item, stage, reason}).
function Session:confirm()
    if self.phase ~= "review" then return false, "notreview" end
    local engine, client = self.engine, self.client
    local failures = {}
    local function fail(a, stage, reason) failures[#failures + 1] = { item = a.item, stage = stage, reason = reason } end

    for _, a in ipairs(self.pending) do
        if a.type == "enroll" then
            if not engine:Get(a.list) then engine:Write("CreateList", { name = "Off-spec", seen = self.seen }, a.list) end
            local ev, err = engine:Append(a.list, "AddMember", { member = a.member, class = self.class[a.member], seen = self.seen })
            if not ev then fail(a, "ledger", err) end
        elseif a.type == "award" then
            local ok, why = true, nil
            if a.item.slot then ok, why = client:give(a.item.slot, a.to) end
            if ok then
                local ev, err = engine:Append(a.list, "Award",
                    { member = a.member, item = a.item.link, to = (a.to ~= a.member) and a.to or nil, seen = a.item.seen })
                if not ev then fail(a, "ledger", err) end
            else
                fail(a, "give", why)
            end
        elseif a.type == "disenchant" then
            local ok, why = true, nil
            if a.item.slot then ok, why = client:give(a.item.slot, a.to) end
            if ok then
                local ev, err = engine:Append(a.list, "Disenchant", { item = a.item.link, to = a.to, seen = a.item.seen })
                if not ev then fail(a, "ledger", err) end
            else
                fail(a, "give", why)
            end
        elseif a.type == "pass" then
            engine:Append(a.list, "Pass", { member = a.member, item = a.item.link, kind = a.kind, seen = a.item.seen })
        end
    end
    self.phase = "done"
    self:emit("done", { failures = failures })
    return true, failures
end

function Session:cancel()
    if self.phase == "done" or self.phase == "cancelled" then return false end
    self:clearTimer()
    self.turn, self.pending = nil, {}
    self.phase = "cancelled"
    self:emit("phase", { phase = "cancelled" })
    return true
end

-- Who wants a token, in list order, and how ready each says they are: { { player, kind, ready } }.
-- Shown to everyone as a hint (Tokens.lua); nil if the item is not a token.
function Session:readiness(itemId)
    local it = self.items[itemId]
    if not (it and it.token) then return nil end
    local out = {}
    for _, name in ipairs(self.order.main) do
        local b = self.bids[name] and self.bids[name][itemId]
        if b and b.kind ~= "pass" then out[#out + 1] = { player = name, kind = b.kind, ready = b.ready } end
    end
    return out
end

-- A snapshot for UIs and tests.
function Session:status()
    local answered, total = self:answerCount()
    return { phase = self.phase, turn = self.turn, items = self.items, pending = self.pending,
        answered = answered, eligible = total, deadline = self.deadline }
end

end; chunk("KingsGambit", SK) end
-- ===== SimNetwork.lua =====
do local chunk = function(...)
-- King's Gambit: SimNetwork, a simulated addon-message network joining several MockClients
-- (Phase 3). One shared clock drives every attached client, so multi-player runs are
-- deterministic. It can add latency and jitter, drop and duplicate messages, and partition
-- the group. Used by the sync tests now and by training sessions later.
-- Keep this file Lua 5.1-safe (no `//`, no bitwise operators).
local _, SK = ...
local M = SK:NewModule("SimNetwork")

local PM_MOD = 2147483647

-- opts: seed, latency (seconds, default 0.1), jitter (extra random seconds, default 0),
--       dropRate, duplicateRate (0..1, default 0).
function M.New(opts)
    opts = opts or {}
    local seed = ((opts.seed or 1) % PM_MOD) + 0.0
    if seed == 0 then seed = 1 end
    local function rnd()
        seed = (seed * 16807) % PM_MOD
        return seed / PM_MOD
    end

    local net = {
        time = 0, quantum = opts.quantum or 0.05, latency = opts.latency or 0.1, jitter = opts.jitter or 0,
        dropRate = opts.dropRate or 0, duplicateRate = opts.duplicateRate or 0,
        nodes = {}, order = {}, queue = {}, nextSeq = 1, groups = nil,
        stats = { sent = 0, delivered = 0, dropped = 0, duplicated = 0, blocked = 0 },
    }

    -- name must equal the client's me(). o: { guild = true, raid = true } channel membership.
    -- Attaching a name again (a player who reloaded) replaces its node; it is still stepped once per tick.
    function net:attach(client, o)
        o = o or {}
        local name = client:me()
        local node = { name = name, client = client, guild = o.guild ~= false, raid = o.raid ~= false,
            offset = client:now() - self.time }
        if not self.nodes[name] then self.order[#self.order + 1] = name end
        self.nodes[name] = node
        client.onSend = function(_, msg) self:route(node, msg) end
        return node
    end

    -- groups: array of arrays of names. Nodes can only talk within their own group.
    function net:partition(groups)
        self.groups = {}
        for gi, g in ipairs(groups) do
            for _, name in ipairs(g) do self.groups[name] = gi end
        end
    end

    function net:heal() self.groups = nil end

    function net:reachable(a, b)
        if not self.groups then return true end
        return self.groups[a] ~= nil and self.groups[a] == self.groups[b]
    end

    function net:enqueue(to, msg, due)
        self.queue[#self.queue + 1] = { due = due, seq = self.nextSeq, to = to, msg = msg }
        self.nextSeq = self.nextSeq + 1
    end

    function net:route(from, msg)
        if msg.kind ~= "addon" then return end
        for _, name in ipairs(self.order) do
            local node = self.nodes[name]
            local wanted
            if node == from then wanted = false
            elseif msg.channel == "WHISPER" then wanted = (node.name == msg.target)
            elseif msg.channel == "GUILD" then wanted = node.guild
            else wanted = node.raid end -- RAID and PARTY
            if wanted then
                self.stats.sent = self.stats.sent + 1
                if rnd() < self.dropRate then
                    self.stats.dropped = self.stats.dropped + 1
                else
                    -- stamped with the sender's own clock, so a timer firing mid-step is exact
                    local sentAt = from.client:now() - from.offset
                    local due = sentAt + self.latency + rnd() * self.jitter
                    self:enqueue(node, msg, due)
                    if rnd() < self.duplicateRate then
                        self.stats.duplicated = self.stats.duplicated + 1
                        self:enqueue(node, msg, due + 0.05 + rnd() * self.latency)
                    end
                end
            end
        end
    end

    local function stepClients(self, dt)
        if dt <= 0 then return end
        for _, name in ipairs(self.order) do self.nodes[name].client:advance(dt) end
    end

    local function earliest(self)
        local best, bi
        for i, item in ipairs(self.queue) do
            if not best or item.due < best.due or (item.due == best.due and item.seq < best.seq) then best, bi = item, i end
        end
        return best, bi
    end

    -- Move the shared clock forward in small steps, advancing every client and delivering
    -- messages as they come due.
    function net:advance(sec)
        local target = self.time + sec
        while true do
            local best, bi = earliest(self)
            if best and best.due <= self.time then
                table.remove(self.queue, bi)
                if self:reachable(best.msg.from, best.to.name) then
                    self.stats.delivered = self.stats.delivered + 1
                    best.to.client:receive(best.msg.prefix, best.msg.payload, best.msg.channel, best.msg.from)
                else
                    self.stats.blocked = self.stats.blocked + 1
                end
            else
                if self.time >= target then break end
                local nextT = target
                if best and best.due < nextT then nextT = best.due end
                if nextT > self.time + self.quantum then nextT = self.time + self.quantum end
                stepClients(self, nextT - self.time)
                self.time = nextT
            end
        end
    end

    function net:inFlight() return #self.queue end

    return net
end

end; chunk("KingsGambit", SK) end
-- ===== Sync.lua =====
do local chunk = function(...)
-- King's Gambit: ledger sync over addon messages (ledger v2: one chain per writer).
-- Live events are pushed as they are written (guild channel, and raid channel when in a raid). A heartbeat
-- lists every chain a peer has (count and head) so anyone can notice what they are missing and ask for it.
-- Everything is idempotent (events are content-addressed), so duplicates, reordering and lost messages are
-- safe. A chain only forks if its writer wrote from two machines with stale data; that rare case is resolved
-- deterministically (longer branch wins, ties to the lower id) and the losing events are kept for review.
--
-- Messages (serialized tables, split into <=255-byte frames):
--   H  heartbeat  { t="H", l = ledger id or "", g = genesis chain or "", c = { [chain] = { n, h } } }
--   R  request    { t="R", c = chain, from = seq }      -> reply E starting at `from`
--   E  events     { t="E", c = chain, n = sender's count, events = { ... } }
-- Other modules plug in their own message types with Sync:register (two or more letters).
local _, SK = ...
local Hash
local M = SK:NewModule("Sync", { "Hash" }, function(d) Hash = d.Hash end)

M.PREFIX = "KGAMBIT"

local DEFAULTS = {
    heartbeat = 30,          -- seconds between heartbeats
    firstHeartbeat = 1,      -- first heartbeat after start (plus jitter)
    firstJitter = 2,
    maxBatch = 20,           -- events per E message (at most)
    maxBytes = 1200,         -- serialized size cap per E message (~5 frames), so one lost frame costs little
    burst = 6,               -- frames sent per pump
    pumpEvery = 0.25,
    requestCooldown = 8,     -- do not repeat the same request sooner than this
    partialTimeout = 30,     -- drop half-received messages after this long
    forkTimeout = 60,
    retryAfter = 3,          -- re-send a request that made no progress after this long
    maxRetries = 8,
}

local Sync = {}
Sync.__index = Sync

function M.New(engine, opts)
    local cfg = {}
    for k, v in pairs(DEFAULTS) do cfg[k] = v end
    for k, v in pairs(opts or {}) do cfg[k] = v end
    return setmetatable({
        engine = engine, client = engine.client, cfg = cfg,
        outbox = {}, partial = {}, nextMsgId = 1, lastRequest = {}, forkBuf = {}, custom = {}, waiting = {},
        handlers = {}, unsub = {}, timers = {}, blocked = nil, running = false,
        stats = { rejected = 0, droppedFrames = 0, forksResolved = 0, otherLedger = 0 },
    }, Sync)
end

---------------------------------------------------------------- events
-- Events: forkResolved { chain, at, winner = "ours"|"theirs", orphaned }
function Sync:on(event, fn)
    local list = self.handlers[event]
    if not list then list = {}; self.handlers[event] = list end
    local entry = { fn = fn, active = true }
    list[#list + 1] = entry
    return function() entry.active = false end
end

function Sync:emit(event, payload)
    local snapshot = {}
    for i, e in ipairs(self.handlers[event] or {}) do snapshot[i] = e end
    for _, e in ipairs(snapshot) do
        if e.active then e.fn(payload) end
    end
end

---------------------------------------------------------------- lifecycle
function Sync:start()
    if self.running then return end
    self.running = true
    local c, cfg = self.client, self.cfg
    c:registerPrefix(M.PREFIX)
    self.unsub[#self.unsub + 1] = c:on("comms.received", function(p) self:onComms(p) end)
    self.unsub[#self.unsub + 1] = c:on("comms.restrictionChanged", function(p)
        if not p.restricted then self.blocked = nil; self:pump() end
    end)
    self.unsub[#self.unsub + 1] = self.engine:OnChange(function(kind, cid, ev) self:onChange(kind, cid, ev) end)
    self.timers[#self.timers + 1] = c:every(cfg.pumpEvery, function() self:pump() end)
    self.timers[#self.timers + 1] = c:every(cfg.heartbeat, function() self:heartbeat() end)
    self.timers[#self.timers + 1] = c:after(cfg.firstHeartbeat + c:random() * cfg.firstJitter, function() self:heartbeat() end)
end

function Sync:stop()
    self.running = false
    for _, off in ipairs(self.unsub) do off() end
    for _, t in ipairs(self.timers) do self.client:cancel(t) end
    self.unsub, self.timers = {}, {}
end

function Sync:status()
    return { pending = #self.outbox, blocked = self.blocked, rejected = self.stats.rejected,
        forksResolved = self.stats.forksResolved, resolvingForks = next(self.forkBuf) ~= nil }
end

function Sync:register(t, fn)
    assert(#t > 1, "plugin message types must be longer than one character")
    self.custom[t] = fn
end

function Sync:send(msg, channel, target) self:post(msg, channel, target) end

---------------------------------------------------------------- sending
-- Serialize, split into frames, queue, and try to send right away.
-- Frame = 4 hex message id + 3-digit part + 3-digit part count + data.
-- The message id is derived from the content, so when the same reply is sent again (a retried request)
-- its frames carry the same id and the receiver combines them with frames kept from earlier attempts:
-- on a lossy link every retry makes progress instead of starting over.
function Sync:post(msg, channel, target)
    local payload = self.client:serialize(msg)
    local id = Hash.Sum(payload):sub(1, 4)
    local room = self.client.maxMessage - 10
    local n = math.max(1, math.ceil(#payload / room))
    if n > 999 then self.stats.droppedFrames = self.stats.droppedFrames + n; return end
    for i = 1, n do
        local frame = ("%s%03d%03d"):format(id, i, n) .. payload:sub((i - 1) * room + 1, i * room)
        self.outbox[#self.outbox + 1] = { channel = channel, target = target, frame = frame }
    end
    self:pump()
end

-- Re-send requests that have made no progress (their reply was probably lost). Because message ids are
-- content-derived, each retry's reply adds to the frames already received.
function Sync:retryRequests()
    local now = self.client:now()
    for cid, w in pairs(self.waiting) do
        local chain = self.engine.store.chains[cid]
        local have = chain and #chain.events or 0
        if have >= w.from then
            self.waiting[cid] = nil
        elseif now - w.at >= self.cfg.retryAfter then
            if w.tries >= self.cfg.maxRetries then
                self.waiting[cid] = nil -- give up; the next heartbeat starts over
            else
                w.tries, w.at = w.tries + 1, now
                self:post({ t = "R", c = cid, from = w.from }, "WHISPER", w.sender)
            end
        end
    end
end

-- Send queued frames, a few at a time. Restricted or throttled sends stay queued and retry.
function Sync:pump()
    self:retryRequests()
    local sent = 0
    while #self.outbox > 0 and sent < self.cfg.burst do
        local m = self.outbox[1]
        local ok, why = self.client:send(M.PREFIX, m.frame, m.channel, m.target)
        if ok then
            table.remove(self.outbox, 1)
            sent = sent + 1
            self.blocked = nil
        elseif why == "restricted" or (why and tostring(why):find("throttle")) then
            self.blocked = why
            return
        else
            table.remove(self.outbox, 1)
            self.stats.droppedFrames = self.stats.droppedFrames + 1
            self.client:log("warn", "sync dropped a frame: " .. tostring(why))
        end
    end
end

local function broadcast(self, msg)
    self:post(msg, "GUILD")
    if self.client:inRaid() then self:post(msg, "RAID") end
end

function Sync:heartbeat()
    local store = self.engine.store
    local c = {}
    for cid, chain in pairs(store.chains) do c[cid] = { n = #chain.events, h = chain.head } end
    broadcast(self, { t = "H", l = store.id or "", g = store.genesisChain or "", c = c })
    local now = self.client:now()
    for key, buf in pairs(self.partial) do
        if now - buf.at > self.cfg.partialTimeout then self.partial[key] = nil end
    end
    for cid, fb in pairs(self.forkBuf) do
        if now - fb.at > self.cfg.forkTimeout then self.forkBuf[cid] = nil end
    end
end

-- Push our own new events to everyone at once (guild and raid), so a parallel raid sees them right away.
function Sync:onChange(kind, cid, ev)
    if kind == "local" then
        broadcast(self, { t = "E", c = cid, n = #self.engine.store.chains[cid].events, events = { ev } })
    elseif kind == "replaced" then
        self:heartbeat()
    end
end

function Sync:request(cid, from, sender, force)
    local key = sender .. "|" .. cid .. "|" .. from
    local now = self.client:now()
    if not force and self.lastRequest[key] and now - self.lastRequest[key] < self.cfg.requestCooldown then return end
    self.lastRequest[key] = now
    self.waiting[cid] = { from = from, sender = sender, at = now, tries = 0 }
    self:post({ t = "R", c = cid, from = from }, "WHISPER", sender)
end

function Sync:sendEvents(cid, from, sender)
    local chain = type(cid) == "string" and self.engine.store.chains[cid]
    if not chain or type(from) ~= "number" or from < 1 then return end
    local evs, last = {}, math.min(#chain.events, from + self.cfg.maxBatch - 1)
    for seq = from, last do
        evs[#evs + 1] = chain.events[seq]
        if #evs > 1 and #self.client:serialize(evs) > self.cfg.maxBytes then
            evs[#evs] = nil
            break
        end
    end
    if #evs == 0 then return end
    self:post({ t = "E", c = cid, n = #chain.events, events = evs }, "WHISPER", sender)
end

---------------------------------------------------------------- receiving
function Sync:onComms(p)
    if p.prefix ~= M.PREFIX or p.sender == self.client:me() then return end
    local f = p.payload
    if type(f) ~= "string" or #f < 10 then return end
    local id, i, n = f:sub(1, 4), tonumber(f:sub(5, 7)), tonumber(f:sub(8, 10))
    if not (i and n and i >= 1 and i <= n) then return end
    local key = p.sender .. id
    local buf = self.partial[key]
    if not buf or buf.n ~= n then
        buf = { n = n, got = 0, parts = {}, at = self.client:now() }
        self.partial[key] = buf
    end
    if not buf.parts[i] then buf.parts[i] = f:sub(11); buf.got = buf.got + 1 end
    if buf.got < n then return end
    self.partial[key] = nil
    local msg = self.client:deserialize(table.concat(buf.parts))
    if type(msg) ~= "table" then return end
    local ok, err = pcall(self.handle, self, msg, p.sender)
    if not ok then self.client:log("error", "sync handler: " .. tostring(err)) end
end

function Sync:handle(msg, sender)
    local t = msg.t
    if t == "H" then self:onHeartbeat(msg, sender)
    elseif t == "R" then self:sendEvents(msg.c, msg.from, sender)
    elseif t == "E" then self:onEvents(msg, sender)
    elseif self.custom[t] then self.custom[t](msg, sender) end
end

function Sync:onHeartbeat(msg, sender)
    if type(msg.c) ~= "table" then return end
    local store = self.engine.store
    if type(msg.l) == "string" and msg.l ~= "" and store.id and msg.l ~= store.id then
        self.stats.otherLedger = self.stats.otherLedger + 1 -- a different ledger (another guild, training)
        return
    end
    if not store.id then
        if type(msg.g) == "string" and msg.g ~= "" then self:request(msg.g, 1, sender) end -- learn the ledger first
        return
    end
    for cid, peer in pairs(msg.c) do
        if type(cid) == "string" and type(peer) == "table" and type(peer.n) == "number" and type(peer.h) == "string"
            and not self.engine.problems[cid] then
            local chain = store.chains[cid]
            local n = chain and #chain.events or 0
            if peer.n > n then
                self:request(cid, n + 1, sender)
            elseif peer.n > 0 and chain.events[peer.n].id ~= peer.h then
                self:request(cid, 1, sender) -- the same chain with two histories: fetch theirs to compare
            end
        end
    end
end

function Sync:onEvents(msg, sender)
    local cid, evs = msg.c, msg.events
    if type(cid) ~= "string" or type(evs) ~= "table" then return end
    local fb = self.forkBuf[cid]
    if fb and fb.sender == sender then return self:forkAppend(cid, evs, msg.n) end

    for idx, ev in ipairs(evs) do
        local status, err = self.engine:Receive(ev)
        if not status then
            if err == "gap" then
                local chain = self.engine.store.chains[cid]
                self:request(cid, (chain and #chain.events or 0) + 1, sender)
            elseif err == "fork" then
                self:beginFork(cid, evs, idx, msg.n, sender)
            elseif err ~= "noledger" then -- noledger: the heartbeat names the genesis chain to fetch first
                self.stats.rejected = self.stats.rejected + 1
                self.client:log("warn", ("sync rejected an event on '%s': %s"):format(cid, tostring(err)))
            end
            return
        end
    end
    local last = evs[#evs]
    if type(msg.n) == "number" and type(last) == "table" and type(last.seq) == "number" and last.seq < msg.n then
        self:request(cid, last.seq + 1, sender, true)
    end
end

---------------------------------------------------------------- the rare chain fork
function Sync:beginFork(cid, evs, idx, total, sender)
    local chain = self.engine.store.chains[cid]
    local first = evs[idx]
    if not chain or type(first) ~= "table" or type(first.seq) ~= "number" then return end
    local k = first.seq
    local prevId = (k == 1) and "0000000000000000" or (chain.events[k - 1] and chain.events[k - 1].id)
    if k > #chain.events + 1 or first.prev ~= prevId then
        return self:request(cid, 1, sender, true) -- split earlier than this batch shows: start from the top
    end
    local seg = {}
    for i = idx, #evs do
        local ev = evs[i]
        if ev.seq ~= k + #seg or (#seg > 0 and ev.prev ~= seg[#seg].id) then break end
        seg[#seg + 1] = ev
    end
    self.forkBuf[cid] = { sender = sender, k = k, events = seg, total = total or seg[#seg].seq, at = self.client:now() }
    self:forkProgress(cid)
end

function Sync:forkAppend(cid, evs, total)
    local fb = self.forkBuf[cid]
    if type(total) == "number" then fb.total = total end
    for _, ev in ipairs(evs) do
        local last = fb.events[#fb.events]
        if ev.seq == last.seq + 1 and ev.prev == last.id then
            fb.events[#fb.events + 1] = ev
        elseif ev.seq > last.seq + 1 or (ev.seq == last.seq + 1 and ev.prev ~= last.id) then
            self.forkBuf[cid] = nil
            return self:request(cid, 1, fb.sender, true)
        end
    end
    self:forkProgress(cid)
end

function Sync:forkProgress(cid)
    local fb = self.forkBuf[cid]
    local last = fb.events[#fb.events].seq
    if last < fb.total then return self:request(cid, last + 1, fb.sender, true) end
    self:decideFork(cid)
end

function Sync:decideFork(cid)
    local fb = self.forkBuf[cid]
    self.forkBuf[cid] = nil
    local chain = self.engine.store.chains[cid]
    if not chain then return end
    local n, k = #chain.events, fb.k
    local mine, theirs = chain.events[k], fb.events[1]
    local theirsWins
    if fb.total ~= n then theirsWins = fb.total > n
    elseif mine then theirsWins = theirs.id < mine.id
    else theirsWins = true end
    if not theirsWins then
        self:emit("forkResolved", { chain = cid, at = k, winner = "ours", orphaned = 0 })
        return
    end
    local orphaned = n - k + 1
    local ok, err = self.engine:ReplaceChainSuffix(cid, k, fb.events)
    if not ok then
        self.stats.rejected = self.stats.rejected + 1
        self.client:log("warn", ("sync refused a fork on '%s': %s"):format(cid, tostring(err)))
        return
    end
    self.stats.forksResolved = self.stats.forksResolved + 1
    self:emit("forkResolved", { chain = cid, at = k, winner = "theirs", orphaned = orphaned })
end

-- ===== Tokens.lua =====
do local chunk = function(...)
-- King's Gambit: tokens and readiness (Phase 4.5).
-- Some raids (Ahn'Qiraj) drop tokens instead of gear: a class-group item that is turned in, with
-- materials and reputation, for a tier piece. Tokens are bid on like gear, under the same rules. What
-- this module adds is READINESS: can the bidder actually redeem it? Readiness is shown, never enforced
-- (taking a token you can't redeem yet is your call; mistakes are fixed by correction or by trade), and
-- it is shared with the raid as a hint only: materials in the bank can't be seen by anyone else.
--
-- A bid's readiness is one of:
--   "ready"     the bidder's addon found everything a turn-in for their class needs
--   "says"      the bidder says they are ready (e.g. materials in the bank, or no addon: "1 need ready")
--   "notready"  the bidder's addon looked and something is missing
--   nil         unknown (not a token, or its requirements aren't in our data yet)
-- Design: docs/design-journal.md ("Tokens, readiness, materials, and list scope").
local _, SK = ...
-- Raid data modules that may hold tokens (items with a `token` field). Optional dependencies: without them a
-- token's readiness is the player's own word.
local SOURCES, sources, deps = { "AQ40" }, {}, {}
for i, name in ipairs(SOURCES) do deps[i] = name .. "?" end
local M = SK:NewModule("Tokens", deps, function(d)
    for _, name in ipairs(SOURCES) do sources[name] = d[name] end
end)
M.SOURCES = SOURCES

M.STATES = { ready = true, says = true, notready = true }
M.LABELS = { ready = "ready", says = "says ready", notready = "not ready (from bags)" }

-- Reputation standings, as the game numbers them (1 = Hated ... 8 = Exalted).
M.REACTIONS = { Hated = 1, Hostile = 2, Unfriendly = 3, Neutral = 4, Friendly = 5, Honored = 6, Revered = 7, Exalted = 8 }

local byId, byName
local function index()
    if byId then return end
    byId, byName = {}, {}
    for _, src in ipairs(M.SOURCES) do
        local data = sources[src]
        for id, item in pairs(data and data.items or {}) do
            if item.token then byId[id] = item; byName[item.name:lower()] = item end
        end
    end
end

-- The token data for an item link ("|Hitem:20928:...|h[...]|h"), item id, or plain name; nil if not a token.
function M.Find(link)
    index()
    if type(link) == "number" then return byId[link] end
    if type(link) ~= "string" then return nil end
    local id = tonumber(link:match("item:(%d+)"))
    if id then return byId[id] end
    local name = link:match("%[(.-)%]") or link
    return byName[name:lower()]
end

-- Forget the index (tests and the simulator swap data in).
function M.Reset() byId, byName = nil, nil end

-- Can a player of `class` redeem `token` with what they have?
-- count(itemNameOrId) -> number held; reaction(factionId, factionName) -> 1..8 or nil.
-- Returns "ready", "notready", or nil when no turn-in for the class is known yet. Any one known turn-in
-- for the class (e.g. shoulders OR boots) being satisfied is enough. The token itself is not counted:
-- it is what the bid is for.
function M.Check(token, class, count, reaction)
    local turnIns = token and token.token and token.token.turnIns
    local options = turnIns and turnIns[class]
    if not options or #options == 0 then return nil end
    for _, t in ipairs(options) do
        local ok = true
        for _, need in ipairs(t.needs or {}) do
            local what, n = need[1], need[2] or 1
            if what ~= token.id and what ~= token.name and (count(what) or 0) < n then ok = false end
        end
        local rep = t.reputation
        if ok and rep then
            local at = reaction and reaction(rep.factionId, rep.faction)
            if not at or at < (M.REACTIONS[rep.standing] or 99) then ok = false end
        end
        if ok then return "ready" end
    end
    return "notready"
end

-- What the bid carries: the addon's finding, or the player's own word when the addon can't see it.
-- declared = true when the player says they are ready.
function M.Combine(computed, declared)
    if computed == "ready" then return "ready" end
    if declared then return "says" end
    return computed
end

-- Readiness for this client's own player, from bags and bank (the bank count is the game's cache).
function M.Mine(client, token, class, declared)
    local computed = M.Check(token, class,
        function(what) return client:itemCount(what, true) end,
        function(factionId, name) return client:reputation(factionId, name) end)
    return M.Combine(computed, declared)
end

function M.Label(state) return state and M.LABELS[state] or "unknown" end

end; chunk("KingsGambit", SK) end

do local chunk = function(...)
-- King's Gambit: simulated raids with bot raiders (Phase 4.5, training mode foundation).
-- A Sim is a MockClient + Engine + a roster of bots that answer loot sessions according to
-- simple data-driven policies. The learner (the Master Looter) is the one human in it.
-- Runs anywhere Lua runs, including a browser. Keep this file Lua 5.1-safe.
local _, SK = ...
local MockClient, Engine, Loot, Tokens, MoltenCore, AQ40
local M = SK:NewModule("Sim", { "MockClient", "Engine", "Loot", "Tokens?", "MoltenCore?", "AQ40?" }, function(d)
    MockClient, Engine, Loot, Tokens, MoltenCore, AQ40 = d.MockClient, d.Engine, d.Loot, d.Tokens, d.MoltenCore, d.AQ40
end)

local CLASSES = { "WARRIOR", "PALADIN", "HUNTER", "ROGUE", "PRIEST", "MAGE", "WARLOCK", "DRUID", "SHAMAN" }

-- A policy is a table (or you can supply functions with the same names):
--   bid   = { [itemLink] = "need" | "off" | "pass" | { "gift", to = "Name" } | { "pass", passKind = "upgrade" } }
--   default = kind used for items not listed in `bid` (default "pass")
--   pick  = "first" | { itemLink, ... } (preference order when it is this bot's draft turn)
--   skip  = true to skip a draft turn instead of picking
--   claim = true to claim backstop offers (false = decline); claimTo = "Name" to gift the item up
local Sim = {}
Sim.__index = Sim

local function short(name) return (name:gsub("%-.*$", "")) end

-- opts: seed, learner (default "You"), members (array of names, or of { name, class, role }; top of the
--       list first), learnerPosition ("last" default, or "first"), learnerClass, learnerRole,
--       shuffle (random order from the seed).
function M.NewRaid(opts)
    opts = opts or {}
    local learner = opts.learner or "You"
    local client = MockClient.New({ name = learner, realm = "Realm", seed = opts.seed or 1 })
    local engine = Engine.New(client)
    engine:CreateList("main", "Main")

    local names = {}
    for _, n in ipairs(opts.members or {}) do names[#names + 1] = n end
    if opts.shuffle then
        for i = #names, 2, -1 do
            local j = client:random(i)
            names[i], names[j] = names[j], names[i]
        end
    end
    if opts.learnerPosition == "first" then table.insert(names, 1, learner) else names[#names + 1] = learner end

    local roster, info = {}, {}
    for i, m in ipairs(names) do
        local n, class, role
        if type(m) == "table" then n, class, role = m.name, m.class, m.role
        else n, class = m, (m == learner and opts.learnerClass) or CLASSES[((i - 1) % #CLASSES) + 1] end
        if n == learner then role = opts.learnerRole or role end
        names[i] = n
        roster[i] = { name = n, class = class }
        info[n] = { class = class, role = role }
        engine:Append("main", "AddMember", { member = n .. "-Realm", class = class })
    end
    client:setRaid(roster, { leader = learner, lootMethod = "master", masterLooter = learner })

    return setmetatable({
        client = client, engine = engine, names = names, learner = learner .. "-Realm",
        policies = {}, autoLearner = false, session = nil, log = {}, info = info, held = {}, rngState = opts.seed or 1,
    }, Sim)
end

function Sim:note(text) self.log[#self.log + 1] = { t = self.client:now(), text = text } end

function Sim:isBot(fullName)
    if fullName == self.learner then return self.autoLearner end
    return true
end

function Sim:policyFor(fullName) return self.policies[short(fullName)] or {} end

local function wantedKind(policy, link)
    local b = policy.bid and policy.bid[link]
    if b == nil then b = policy.default or "pass" end
    if type(b) == "table" then return b[1], b end
    return b, nil
end

-- Start a loot session for these item links and wire the bots to it.
-- cfg overrides Loot defaults (bidSeconds, pickSeconds, ...).
-- seen (optional): for each link, when that loot became visible (held loot dropped earlier).
function Sim:drop(links, cfg, seen)
    local drops, items = {}, {}
    for i, link in ipairs(links) do
        drops[i] = { link = link }
        items[i] = { link = link, slot = i, seen = seen and seen[i] or nil }
    end
    self.client:dropLoot(drops)
    local session = Loot.NewSession(self.engine, cfg)
    self.session = session
    local ok, why = session:start(items)
    if not ok then return false, why end
    self:wireBots()
    return true
end

function Sim:wireBots()
    local s, client = self.session, self.client
    -- Bids trickle in over the first part of the timer, in a repeatable order.
    local window = math.max(2, math.min((s.cfg.bidSeconds or 30) - 4, 14))
    for _, name in ipairs(s.eligibleList) do
        if self:isBot(name) then
            local policy = self:policyFor(name)
            for _, it in ipairs(s.items) do
                client:after(1 + client:random() * window, function()
                    if s.phase ~= "bidding" then return end
                    local kind, extra = wantedKind(policy, it.link)
                    s:bid(name, it.id, kind, extra)
                end)
            end
        end
    end
    s:on("turn", function(turn)
        if not self:isBot(turn.player) then return end
        local policy = self:policyFor(turn.player)
        client:after(1 + client:random() * 3, function()
            if s.turn ~= turn then return end
            if turn.type == "pick" then
                local pick
                if not policy.skip then
                    local prefs = type(policy.pick) == "table" and policy.pick or nil
                    if prefs then
                        for _, link in ipairs(prefs) do
                            for _, id in ipairs(turn.options) do
                                if s.items[id].link == link and not pick then pick = id end
                            end
                        end
                    end
                    pick = pick or turn.options[1]
                end
                if pick then s:pick(turn.player, pick) else s:skip(turn.player) end
            else
                if policy.claim then s:claimItem(turn.player, policy.claimTo and { to = policy.claimTo } or nil)
                else s:decline(turn.player) end
            end
        end)
    end)
end

function Sim:advance(sec) self.client:advance(sec) end

-- Advance the clock until the session reaches `phase` (or done), up to maxSeconds.
function Sim:runUntil(phase, maxSeconds)
    local waited = 0
    while self.session.phase ~= phase and waited < (maxSeconds or 300) do
        self.client:advance(1)
        waited = waited + 1
    end
    return self.session.phase == phase
end

function Sim:order()
    local out = {}
    for i, n in ipairs(self.engine:Get("main").state.order) do out[i] = short(n) end
    return out
end

function Sim:orderString() return table.concat(self:order(), ",") end

-- A plain-table view of everything a UI needs to draw.
function Sim:snapshot()
    local s = self.session
    local snap = { order = self:order(), phase = s and s.phase or "idle", head = self.engine:Get("main").head }
    if s then
        local status = s:status()
        snap.answered, snap.eligible, snap.deadline, snap.now = status.answered, status.eligible, status.deadline, self.client:now()
        snap.items = {}
        for i, it in ipairs(s.items) do
            snap.items[i] = { id = it.id, link = it.link, status = it.status, winner = it.winner and short(it.winner), to = it.to and short(it.to), tier = it.tier }
            local rows = s:readiness(it.id)
            if rows then
                local wanted = {}
                for k, r in ipairs(rows) do wanted[k] = { player = short(r.player), kind = r.kind, ready = r.ready, label = Tokens.Label(r.ready) } end
                snap.items[i].token = { makes = it.token.token.makes, wanted = wanted }
            end
        end
        if s.turn then
            snap.turn = { type = s.turn.type, player = short(s.turn.player), options = s.turn.options, item = s.turn.item, tier = s.turn.tier }
        end
    end
    return snap
end

---------------------------------------------------------------- scenarios
-- sc: { id, title, lesson, members, items, policies = { [name] = policy }, you = policy,
--       after = function(sim), expect = function(sim) -> ok, message }
function M.RunScenario(sc, opts)
    opts = opts or {}
    local sim = M.NewRaid({ members = sc.members, seed = opts.seed or 1, learner = "You" })
    sim.policies = sc.policies or {}
    sim.policies["You"] = sc.you or {}
    sim.autoLearner = true
    local ok, why = sim:drop(sc.items, sc.config)
    if not ok then return sim, false, "could not start: " .. tostring(why) end
    if not sim:runUntil("review", 400) then return sim, false, "stuck in phase " .. sim.session.phase end
    local confirmed, failures = sim.session:confirm()
    if not confirmed then return sim, false, "confirm failed: " .. tostring(failures) end
    if sc.after then sc.after(sim) end
    local passed, message = sc.expect(sim)
    return sim, passed and true or false, message
end

---------------------------------------------------------------- raid nights (Molten Core, Ahn'Qiraj)
-- A realistic 40-person Alliance raid: class and role for every bot. The learner fills one healer slot.
local MC_ROSTER = {
    { "WARRIOR", "tank", 3 }, { "WARRIOR", "melee", 5 }, { "ROGUE", "melee", 5 }, { "HUNTER", "hunter", 4 },
    { "MAGE", "caster", 6 }, { "WARLOCK", "caster", 4 }, { "PRIEST", "healer", 6 }, { "DRUID", "healer", 2 },
    { "DRUID", "tank", 1 }, { "PALADIN", "healer", 3 }, { "PALADIN", "melee", 1 },
}
local MC_NAMES = { "Aldric", "Brann", "Cass", "Dara", "Eira", "Fenn", "Garo", "Hale", "Ilsa", "Jory", "Kest", "Lio",
    "Mirel", "Nyx", "Orsa", "Pell", "Quill", "Rhea", "Soren", "Tavi", "Ulf", "Vera", "Wren", "Xan", "Yara", "Zed",
    "Ansel", "Bryn", "Corin", "Delia", "Emrys", "Fia", "Gideon", "Halia", "Ivo", "Jessa", "Kael", "Lysa", "Moro" }
local ARMOR = { WARRIOR = "plate", PALADIN = "plate", HUNTER = "mail", SHAMAN = "mail", ROGUE = "leather",
    DRUID = "leather", PRIEST = "cloth", MAGE = "cloth", WARLOCK = "cloth" }
-- Hybrids can also use the other role's gear as off-spec.
local OFFSPEC = { DRUID = { healer = "tank", tank = "healer" }, PALADIN = { healer = "melee", melee = "healer" },
    WARRIOR = { tank = "melee", melee = "tank" }, PRIEST = { healer = "caster" } }

local function hasBit(mask, bit) return math.floor(mask / bit) % 2 == 1 end

-- Does an item's role tag ("healer", or several joined with "|", e.g. "caster|healer") include this role?
local function forRole(item, role)
    if not (item.role and role) then return false end
    for r in item.role:gmatch("[^|]+") do if r == role then return true end end
    return false
end

-- Would a raider of this class and role want the item, and as main or off-spec?
-- Returns "need", "off" or nil. Deliberately simple: tier pieces and class tokens by class, other items
-- (and tokens open to everyone) by role and armor type.
function M.Wants(data, item, class, role)
    if item.classes ~= 0 then
        local bit = data.CLASS_BITS[class]
        return (bit and hasBit(item.classes, bit)) and "need" or nil
    end
    if item.armor and item.armor ~= ARMOR[class] then return nil end
    if forRole(item, role) then return "need" end
    local off = OFFSPEC[class] and OFFSPEC[class][role]
    if off and forRole(item, off) then return "off" end
end

-- data: a raid data module (MoltenCore, AQ40). opts: seed, learner ("You"), learnerClass ("PRIEST"),
-- learnerRole ("healer"), shuffle (default true), chance (probability a raider who could use an item still
-- needs it; default 0.7), readiness (for tokens: chances a bot is { ready, says } ready; the rest are not
-- ready; default { 0.55, 0.2 }).
function M.NewRaidNight(data, opts)
    opts = opts or {}
    local members, k = {}, 0
    for _, row in ipairs(MC_ROSTER) do
        for _ = 1, row[3] do
            k = k + 1
            members[#members + 1] = { name = MC_NAMES[k], class = row[1], role = row[2] }
        end
    end
    members[#members] = nil -- the learner takes the 40th slot (a healer)
    local sim = M.NewRaid({ members = members, seed = opts.seed or 1, learner = opts.learner or "You",
        learnerClass = opts.learnerClass or "PRIEST", learnerRole = opts.learnerRole or "healer",
        shuffle = opts.shuffle ~= false })
    sim.raid = data
    sim.chance = opts.chance or 0.7
    sim.readiness = opts.readiness or { 0.55, 0.2 }
    sim.bossIndex = 0
    return sim
end

function M.NewMoltenCore(opts) return M.NewRaidNight(MoltenCore, opts) end
-- Ahn'Qiraj: tokens (class-group tier tokens, plus weapon and C'Thun tokens) drop beside gear.
function M.NewAQ40(opts) return M.NewRaidNight(AQ40, opts) end

-- The next boss (or a named one) dies and rolls its loot from the real table. Returns the boss and the
-- dropped items ({ id, name, ... }). With hold = true the loot is set aside for a later hand-out.
function Sim:killBoss(name, hold)
    local MC = assert(self.raid, "not a raid night")
    local boss
    if name then
        for i, b in ipairs(MC.bosses) do if b.name == name then boss, self.bossIndex = b, i end end
    else
        self.bossIndex = self.bossIndex + 1
        boss = MC.bosses[self.bossIndex]
    end
    if not boss then return nil, "noboss" end
    local pool = {}
    for i, entry in ipairs(boss.loot) do pool[i] = { id = entry[1], w = entry[2] } end
    local dropped = {}
    for _ = 1, boss.drops do
        local total = 0
        for _, e in ipairs(pool) do total = total + e.w end
        if total <= 0 then break end
        local r, acc = self.client:random() * total, 0
        for i, e in ipairs(pool) do
            acc = acc + e.w
            if r < acc or i == #pool then
                dropped[#dropped + 1] = MC.items[e.id]
                table.remove(pool, i)
                break
            end
        end
    end
    for _, item in ipairs(dropped) do
        self.held[#self.held + 1] = { item = item, boss = boss.name, seen = self.client:serverTime() }
    end
    self:note(boss.name .. " died and dropped " .. #dropped .. " item(s)")
    if not hold then self:handOut() end
    return boss, dropped
end

-- A bot's readiness for a token: most dedicated raiders bought their materials; some say so (bank); some
-- are not ready and bid anyway (their call).
function Sim:botReadiness()
    local r, odds = self.client:random(), self.readiness
    if r < odds[1] then return "ready" end
    if r < odds[1] + odds[2] then return "says" end
    return "notready"
end

-- Put every held item up for loot in one session. The bots answer from their class and role.
function Sim:handOut(cfg)
    if #self.held == 0 then return false, "nothing" end
    local held = self.held
    self.held = {}
    local links, seen = {}, {}
    for i, h in ipairs(held) do links[i], seen[i] = h.item.name, h.seen end
    self.policies = {}
    -- Roster order, never pairs(): random draws must happen in the same order in every process.
    for _, name in ipairs(self.names) do
        local info = self.info[name]
        local p = { bid = {}, claim = self.client:random() < 0.3 }
        local wanted = {}
        for _, h in ipairs(held) do
            local kind = M.Wants(self.raid, h.item, info.class, info.role)
            if kind and self.client:random() < self.chance then
                wanted[#wanted + 1] = { link = h.item.name, kind = kind, tier = h.item.classes ~= 0 or h.item.token ~= nil,
                    ready = h.item.token and self:botReadiness() or nil }
            elseif kind then
                p.bid[h.item.name] = { "pass", passKind = "upgrade" } -- could use it, chose not to spend the spot
            end
        end
        -- ranked choice: tier pieces first, then main-spec, then off-spec
        table.sort(wanted, function(a, b)
            if a.kind ~= b.kind then return a.kind == "need" end
            if a.tier ~= b.tier then return a.tier end
            return a.link < b.link
        end)
        for rank, w in ipairs(wanted) do p.bid[w.link] = { w.kind, rank = rank, ready = w.ready } end
        self.policies[name] = p
    end
    self.handedOut = held
    return self:drop(links, cfg, seen)
end
