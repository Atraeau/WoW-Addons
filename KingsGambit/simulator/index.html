<script type="application/lua">
-- King's Gambit simulator: the thin layer between the page (JavaScript) and the real engine.
-- Everything crosses the boundary as JSON strings. The rules all live in the engine bundle.
local js = require "js"
local S = KG_SK.modules
local Sim, Scenarios = S.Sim, S.Scenarios

---------------------------------------------------------------- JSON encoder
local function isArray(t)
    local n = 0
    for k in pairs(t) do
        if type(k) ~= "number" then return false end
        n = n + 1
    end
    return n == #t
end

local ESC = { ['"'] = '\\"', ["\\"] = "\\\\", ["\n"] = "\\n", ["\r"] = "\\r", ["\t"] = "\\t" }
local function encode(v)
    local t = type(v)
    if t == "string" then
        return '"' .. v:gsub('[%c"\\]', function(c) return ESC[c] or ("\\u%04x"):format(c:byte()) end) .. '"'
    elseif t == "number" then
        if v ~= v or v == math.huge or v == -math.huge then return "null" end
        return (v == math.floor(v)) and ("%d"):format(v) or ("%.6g"):format(v)
    elseif t == "boolean" then
        return v and "true" or "false"
    elseif t == "table" then
        local out = {}
        if isArray(v) then
            for i = 1, #v do out[i] = encode(v[i]) end
            return "[" .. table.concat(out, ",") .. "]"
        end
        local keys = {}
        for k in pairs(v) do keys[#keys + 1] = tostring(k) end
        table.sort(keys)
        for _, k in ipairs(keys) do
            local val = v[k]
            if val == nil then val = v[tonumber(k)] end
            if type(val) ~= "function" then out[#out + 1] = encode(k) .. ":" .. encode(val) end
        end
        return "{" .. table.concat(out, ",") .. "}"
    end
    return "null"
end

local function short(name) return name and (name:gsub("%-.*$", "")) end

---------------------------------------------------------------- state
local sim, scenario, startCount = nil, nil, 0
local FREE_ITEMS = { "Gauntlets of the Ashen Vow", "Cloak of Quiet Embers", "Band of Hollow Oaths", "Helm of Tides", "Mantle of Second Chances", "Staff of Lesser Tides" }
local FREE_NAMES = { "Aldric", "Brann", "Cass", "Dara", "Eira", "Fenn", "Garo", "Hale", "Ilsa", "Jory" }

local function describe(ev)
    local d, t = ev.data, ev.type
    if t == "Award" then
        return short(d.member) .. " won " .. d.item .. (d.to and (" and gave it to " .. short(d.to)) or "")
    elseif t == "Pass" then
        return short(d.member) .. " passed on " .. d.item .. (d.kind and (" (" .. d.kind .. ")") or "")
    elseif t == "Disenchant" then
        return d.item .. " was disenchanted by " .. short(d.to)
    elseif t == "Revert" then
        return "The last award was undone"
    elseif t == "CreateList" then
        return "The " .. tostring(d.name) .. " list was started"
    elseif t == "AddMember" then
        return short(d.member) .. " joined the list"
    elseif t == "Transfer" then
        return "An item was re-routed to " .. short(d.to)
    elseif t == "MovePlayer" then
        return short(d.member) .. " was moved (" .. tostring(d.reason) .. ")"
    end
    return t
end

local function logLines()
    local out = {}
    local applied = sim.engine:View().applied
    for i = startCount + 1, #applied do
        local ev = applied[i]
        if ev.list then out[#out + 1] = { list = ev.list, ts = ev.ts, text = describe(ev) } end
    end
    return out
end

local function state()
    if not sim then return { phase = "none" } end
    local snap = sim:snapshot()
    local s = sim.session
    snap.scenario = scenario and scenario.id or "free"
    snap.you = "You"
    snap.log = logLines()
    if scenario then snap.lesson = { title = scenario.title, text = scenario.lesson } end
    if sim.raid then
        local bosses = sim.raid.bosses
        local nextBoss = bosses[sim.bossIndex + 1]
        snap.night = { next = nextBoss and nextBoss.name or nil, held = {}, killed = sim.bossIndex,
            last = bosses[#bosses].name, raid = scenario and scenario.title }
        for i, h in ipairs(sim.held) do snap.night.held[i] = h.item.name .. " (" .. h.boss .. ")" end
    end
    if not s then
        snap.phase, snap.items, snap.players, snap.pending, snap.now = "idle", {}, {}, {}, sim.client:now()
        snap.cfg = { bidSeconds = 30, pickSeconds = 20, claimSeconds = 10 }
        return snap
    end
    local off = sim.engine:Get("off")
    if off then
        snap.offOrder = {}
        for i, n in ipairs(off.state.order) do snap.offOrder[i] = short(n) end
    end
    -- who has answered what (public: passes are visible by design)
    snap.bids = {}
    snap.players = {}
    for _, n in ipairs(s.eligibleList) do
        local row = { name = short(n), answers = {} }
        for _, it in ipairs(s.items) do
            local b = s.bids[n] and s.bids[n][it.id]
            row.answers[#row.answers + 1] = b and { kind = b.kind, to = short(b.to), passKind = b.passKind, ready = b.ready } or false
        end
        snap.players[#snap.players + 1] = row
    end
    snap.pending = {}
    for _, a in ipairs(s.pending) do
        if a.type == "award" then
            snap.pending[#snap.pending + 1] = { type = "award", tier = a.tier, member = short(a.member), to = short(a.to), item = a.item.link }
        elseif a.type == "disenchant" then
            snap.pending[#snap.pending + 1] = { type = "disenchant", to = short(a.to), item = a.item.link }
        elseif a.type == "enroll" then
            snap.pending[#snap.pending + 1] = { type = "enroll", member = short(a.member), list = a.list }
        end
    end
    snap.cfg = { bidSeconds = s.cfg.bidSeconds, pickSeconds = s.cfg.pickSeconds, claimSeconds = s.cfg.claimSeconds }
    if scenario then snap.lesson = { title = scenario.title, text = scenario.lesson } end
    return snap
end

---------------------------------------------------------------- freeplay
local function freeScenario(seed)
    local rng = Sim.NewRaid({ members = {}, seed = seed })
    local count = 7
    local members = {}
    for i = 1, count do members[i] = FREE_NAMES[i] end
    for i = #members, 2, -1 do
        local j = rng.client:random(i)
        members[i], members[j] = members[j], members[i]
    end
    local items = {}
    local pool = {}
    for i, n in ipairs(FREE_ITEMS) do pool[i] = n end
    for i = 1, 3 do items[i] = table.remove(pool, rng.client:random(#pool)) end
    local policies = {}
    for _, name in ipairs(members) do
        local p = { bid = {}, claim = rng.client:random() < 0.3 }
        for _, link in ipairs(items) do
            local r = rng.client:random()
            if r < 0.30 then p.bid[link] = "need"
            elseif r < 0.42 then p.bid[link] = "off"
            elseif r < 0.48 then p.bid[link] = { "gift", to = members[rng.client:random(#members)] }
            else p.bid[link] = "pass" end
        end
        policies[name] = p
    end
    -- a gift to yourself is meaningless; the engine would refuse it, so keep the bot honest
    for name, p in pairs(policies) do
        for link, b in pairs(p.bid) do
            if type(b) == "table" and b.to == name then p.bid[link] = "need" end
        end
    end
    return { id = "free", title = "Free play", members = members, items = items, policies = policies,
        lesson = "A random raid and a random drop. Run the loot as the Master Looter and watch how the bots behave. Everyone's answers are public, as they are in the real addon.",
        expect = function() return true, "Free play has no right answer. Look at the history on the right to see what was recorded." end }
end

---------------------------------------------------------------- the API
local api = {}

-- Raid nights: a whole raid with a 40-person roster and real loot from real bosses.
local NIGHTS = {
    { id = "mc", title = "Molten Core night", new = Sim.NewMoltenCore,
      lesson = "A full Molten Core night with a 40-person raid and real loot from real bosses. Kill the bosses in order and hand loot out after each one, or hold it and hand it all out at a break: the same rules apply either way. The raiders answer as their class and role would; you are the Master Looter and a healing priest." },
    { id = "aq40", title = "Ahn'Qiraj night", new = Sim.NewAQ40,
      lesson = "The Temple of Ahn'Qiraj drops tokens beside gear: each is for a group of classes and is turned in, with materials and reputation, for a tier piece. Tokens are handed out like any item, under the same rules. Each bidder's readiness is shown (ready, says ready, not ready) so the raid can see it, but it is only a hint and never enforced: materials in the bank can't be seen, and taking a token you can't use yet is your own call." },
}

function api.scenarios()
    local out = {}
    for _, n in ipairs(NIGHTS) do out[#out + 1] = { id = n.id, title = n.title, lesson = n.lesson } end
    for _, sc in ipairs(Scenarios.list) do out[#out + 1] = { id = sc.id, title = sc.title, lesson = sc.lesson } end
    return out
end

local function result(ok, why)
    local s = state()
    s.ok, s.why = ok and true or false, why
    return s
end

function api.start(id, seed)
    seed = tonumber(seed) or 1
    for _, n in ipairs(NIGHTS) do
        if n.id == id then
            scenario = { id = n.id, title = n.title, lesson = n.lesson }
            sim = n.new({ seed = seed })
            startCount = #sim.engine:View().applied
            return state()
        end
    end
    scenario = (id == "free") and freeScenario(seed) or Scenarios.find(id)
    if not scenario then return { error = "unknown scenario" } end
    sim = Sim.NewRaid({ members = scenario.members, seed = seed, learner = "You" })
    sim.policies = scenario.policies or {}
    startCount = #sim.engine:View().applied
    local ok, why = sim:drop(scenario.items, scenario.config)
    if not ok then return { error = tostring(why) } end
    return state()
end

function api.state() return state() end

-- A raid night: kill the next boss; hold = "1" keeps the loot for a later hand-out.
function api.kill(hold)
    if not (sim and sim.raid) then return { error = "not a raid night" } end
    if sim.session and sim.session.phase ~= "done" and sim.session.phase ~= "cancelled" then
        return result(false, "finish handing out the current loot first")
    end
    local boss, why = sim:killBoss(nil, hold == "1")
    return result(boss ~= nil, why)
end

function api.handout()
    if not (sim and sim.raid) then return { error = "not a raid night" } end
    if sim.session and sim.session.phase ~= "done" and sim.session.phase ~= "cancelled" then
        return result(false, "finish handing out the current loot first")
    end
    return result(sim:handOut())
end
function api.advance(sec) if sim then sim:advance(tonumber(sec) or 0) end return state() end

-- kind "needready": need, and you say you can turn the token in.
function api.bid(itemId, kind, to)
    if to == "" then to = nil end
    local ready
    if kind == "needready" then kind, ready = "need", "says" end
    return result(sim.session:bid("You", tonumber(itemId), kind, { to = to, ready = ready }))
end

function api.passAll()
    for _, it in ipairs(sim.session.items) do sim.session:bid("You", it.id, "pass") end
    return state()
end

function api.pick(itemId) return result(sim.session:pick("You", tonumber(itemId))) end
function api.skip() return result(sim.session:skip("You")) end
function api.claim(to)
    if to == "" then to = nil end
    return result(sim.session:claimItem("You", to and { to = to } or nil))
end
function api.decline() return result(sim.session:decline("You")) end
function api.extend(sec) return result(sim.session:extend(tonumber(sec) or 30)) end
function api.resolveNow() return result(sim.session:resolveNow()) end

function api.confirm()
    local ok, failures = sim.session:confirm()
    local s = result(ok, ok and nil or failures)
    if ok then s.failures = failures end
    return s
end

-- Undo the most recent award by writing a Revert event (fix-forward).
function api.undo()
    local chain = sim.engine:Get("main")
    local stack = chain.state.undo[sim.engine:MyChain()]
    local top = stack and stack[#stack]
    if not top then return result(false, "nothing to undo") end
    local ev, err = sim.engine:Append("main", "Revert", { target = top.id })
    return result(ev ~= nil, err)
end

-- Run every training scenario headlessly inside this runtime (used to verify the browser build).
function api.selftest()
    local results = {}
    for _, sc in ipairs(Scenarios.list) do
        local _, ok, msg = Sim.RunScenario(sc)
        results[#results + 1] = { id = sc.id, ok = ok and true or false, message = msg }
    end
    return results
end

function api.check()
    if not scenario then return { ok = false, message = "no scenario" } end
    local ok, message = scenario.expect(sim)
    return { ok = ok and true or false, message = message }
end


---------------------------------------------------------------- sync lab
-- Several real engines (each with its own MockClient) joined by a SimNetwork. Nothing here is
-- special-cased: the Sync module is the same code that will run in the game.
local lab

local function labLog(text) lab.log[#lab.log + 1] = { t = lab.net.time, text = text } end

local function labAddPeer()
    local i = #lab.peers + 1
    local name = lab.names[i]
    if not name then return false end
    local net = lab.net
    local client = S.MockClient.New({ name = name, realm = "Realm", seed = 1000 + i,
        clock = 1000 + net.time, unix = 1760000000 + math.floor(net.time) })
    local engine = S.Engine.New(client)
    local sync = S.Sync.New(engine, { heartbeat = 5, firstHeartbeat = 0.5, firstJitter = 1 })
    net:attach(client)
    sync:start()
    local peer = { name = name, full = name .. "-Realm", client = client, engine = engine, sync = sync, restricted = false }
    sync:on("forkResolved", function(p)
        if p.winner == "theirs" then
            labLog(name .. " found a fork at event " .. p.at .. " and switched to the longer chain; " .. p.orphaned .. " of their own events were set aside for review")
        else
            labLog(name .. " found a fork at event " .. p.at .. " and kept their chain (it was the longer one)")
        end
    end)
    lab.peers[i] = peer
    return peer
end

local function labReset()
    lab = { net = S.SimNetwork.New({ seed = 3, latency = 0.15 }), peers = {}, log = {}, counter = 0, groups = nil,
        names = { "Aldric", "Brann", "Cass", "Dara", "Eira", "Fenn" } }
    for _ = 1, 4 do labAddPeer() end
    local a = lab.peers[1]
    a.engine:CreateList("main", "Main")
    local officers = {}
    for _, n in ipairs(lab.names) do officers[#officers + 1] = n .. "-Realm" end
    a.engine:Write("SetOfficers", { names = officers })
    for i = 1, 5 do a.engine:Append("main", "AddMember", { member = "Raider" .. i .. "-Realm" }) end
    lab.counter = 5
    lab.net:advance(4)
    lab.log = {}
    labLog("Four players are in sync. Try splitting the network, then writing at both ends.")
end

local function labState()
    if not lab then labReset() end
    -- what most peers agree on (ties go to the peer with more events)
    local tally = {}
    for _, p in ipairs(lab.peers) do
        local fp = p.engine:Fingerprint() or "none"
        local n = 0
        for _, c in pairs(p.engine.store.chains) do n = n + #c.events end
        local t = tally[fp] or { fp = fp, votes = 0, n = n, peer = p }
        t.votes = t.votes + 1
        tally[fp] = t
    end
    local best
    for _, t in pairs(tally) do
        if not best or t.votes > best.votes or (t.votes == best.votes and t.n > best.n) then best = t end
    end
    local majority = best.peer.engine.store
    local out = { time = lab.net.time, inFlight = lab.net:inFlight(), stats = lab.net.stats, peers = {}, log = lab.log,
        drop = lab.net.dropRate, dup = lab.net.duplicateRate, split = lab.groups, canAdd = #lab.peers < #lab.names }
    for i, p in ipairs(lab.peers) do
        local e = p.engine
        local n, subset = 0, true
        for _, c in pairs(e.store.chains) do
            n = n + #c.events
            for _, ev in ipairs(c.events) do
                if not majority.byId[ev.id] then subset = false end
            end
        end
        local status = "in sync"
        if (e:Fingerprint() or "none") ~= best.fp then status = subset and "behind" or "diverged" end
        local list = e:Get("main")
        local order = {}
        if list then for j, m in ipairs(list.state.order) do if j <= 6 then order[#order + 1] = short(m) end end end
        local orphans = 0
        for _, o in ipairs(e.db.orphans or {}) do orphans = orphans + #o.events end
        local st = p.sync:status()
        out.peers[i] = { index = i, name = p.name, count = n, head = (e:Fingerprint() or "none"):sub(1, 8), status = status,
            order = order, members = list and #list.state.order or 0, pending = st.pending, blocked = st.blocked,
            rejected = st.rejected, orphans = orphans, restricted = p.restricted }
    end
    return out
end

function api.lab_state() return labState() end
function api.lab_reset() labReset(); return labState() end
function api.lab_advance(sec) if not lab then labReset() end lab.net:advance(tonumber(sec) or 0); return labState() end

function api.lab_write(i, kind)
    if not lab then labReset() end
    local p = lab.peers[tonumber(i)]
    if not p then return { error = "no such player" } end
    local chain = p.engine:Get("main")
    lab.counter = lab.counter + 1
    local ev, err
    if kind == "member" then
        ev, err = p.engine:Append("main", "AddMember", { member = "Raider" .. lab.counter .. "-Realm" })
        if ev then labLog(p.name .. " added a member") end
    else
        local top = chain and chain.state.order[1]
        if not top then return labState() end
        ev, err = p.engine:Append("main", "Award", { member = top, item = "Item " .. lab.counter })
        if ev then labLog(p.name .. " gave an item to " .. short(top)) end
    end
    local s = labState()
    if not ev then s.error = tostring(err) end
    return s
end

-- spec like "1|234": peers in the same group can talk, groups cannot.
function api.lab_partition(spec)
    if not lab then labReset() end
    local groups, names, desc = {}, {}, {}
    for part in tostring(spec):gmatch("[^|]+") do
        local g, label = {}, {}
        for digit in part:gmatch("%d") do
            local p = lab.peers[tonumber(digit)]
            if p then g[#g + 1] = p.full; label[#label + 1] = p.name end
        end
        if #g > 0 then groups[#groups + 1] = g; desc[#desc + 1] = table.concat(label, " + ") end
    end
    lab.net:partition(groups)
    lab.groups = table.concat(desc, "  |  ")
    labLog("Network split: " .. lab.groups)
    return labState()
end

function api.lab_heal()
    if not lab then labReset() end
    lab.net:heal(); lab.groups = nil
    labLog("The network healed. Watch the heads converge.")
    return labState()
end

function api.lab_net(drop, dup)
    if not lab then labReset() end
    lab.net.dropRate = tonumber(drop) or 0
    lab.net.duplicateRate = tonumber(dup) or 0
    labLog(("Network: %d%% of messages lost, %d%% duplicated"):format(lab.net.dropRate * 100, lab.net.duplicateRate * 100))
    return labState()
end

function api.lab_restrict(i, flag)
    if not lab then labReset() end
    local p = lab.peers[tonumber(i)]
    if not p then return labState() end
    p.restricted = (flag == "1")
    p.client:setRestricted(p.restricted)
    labLog(p.name .. (p.restricted and " can no longer send addon messages (like during a boss fight)" or " can send again"))
    return labState()
end

function api.lab_join()
    if not lab then labReset() end
    local p = labAddPeer()
    if p then labLog(p.name .. " logged in with no data and will catch up") end
    return labState()
end

-- JS entry point: window.KG(name, a, b, c) -> JSON string.
js.global.KG = function(_, name, a, b, c)
    local fn = api[name]
    if not fn then return encode({ error = "no such call: " .. tostring(name) }) end
    local ok, res = pcall(fn, a, b, c)
    if not ok then return encode({ error = tostring(res) }) end
    return encode(res)
end

</script>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const call = (name, a, b, c) => JSON.parse(window.KG(name, a, b, c));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const PHASE = { bidding: "Bidding", main: "Main draft", off: "Off-spec draft", backstop: "Backstop", review: "Review", done: "Done", cancelled: "Cancelled" };

  let scenarios = [], current = "mc", seed = 1, st = null;
  let running = true, speed = 4, giftTo = "", prevOrder = [], moved = {}, result = null, lastMsg = "";

  function start(id) {
    current = id; result = null; lastMsg = "";
    st = call("start", id, seed);
    prevOrder = st.order || []; moved = {};
    render();
  }

  function act(name, a, b, c) {
    const r = call(name, a, b, c);
    if (r.ok === false) lastMsg = "Not allowed: " + (r.why || "that action isn't available right now");
    else lastMsg = "";
    if (r.phase) st = r;
    updateMoved();
    render();
  }

  function updateMoved() {
    moved = {};
    (st.order || []).forEach((n, i) => { if (prevOrder.indexOf(n) !== i && prevOrder.length) moved[n] = true; });
    if (st.phase === "done" || st.phase === "review") return;
    prevOrder = st.order || [];
  }

  function chip(a) {
    if (!a) return '<span class="pill wait">&hellip;</span>';
    if (a.kind === "gift") return '<span class="pill gift">gift &rarr; ' + esc(a.to) + "</span>";
    if (a.kind === "pass") return '<span class="pill pass">pass' + (a.passKind ? " (" + esc(a.passKind) + ")" : "") + "</span>";
    return '<span class="pill ' + a.kind + '">' + a.kind + (a.ready ? " &middot; " + READY[a.ready] : "") + "</span>";
  }
  const READY = { ready: "ready", says: "says ready", notready: "not ready" };

  // A token: what it makes, and who wants it with their readiness (a hint, never enforced).
  function tokenHtml(it) {
    if (!it.token) return "";
    const w = it.token.wanted.length ? it.token.wanted.map((r) => esc(r.player) + " (" + (READY[r.ready] || "unknown") + ")").join(", ") : "nobody yet";
    return '<div class="small muted">Token: makes ' + esc(it.token.makes).toLowerCase() + ". Wanted by, in list order: " + w + "</div>";
  }

  function remaining() {
    if (st.deadline == null) return null;
    return Math.max(0, st.deadline - st.now);
  }

  function timerHtml() {
    const rem = remaining();
    if (rem == null) return '<div class="muted small">No timer: open-ended, you decide when to close.</div>';
    const total = st.phase === "bidding" ? st.cfg.bidSeconds : (st.turn && st.turn.type === "claim" ? st.cfg.claimSeconds : st.cfg.pickSeconds);
    return '<div class="bar"><i style="width:' + Math.min(100, (rem / total) * 100) + '%"></i></div><div class="small muted">' + rem.toFixed(0) + "s left</div>";
  }

  function itemName(id) { return st.items[id - 1] ? esc(st.items[id - 1].link) : "?"; }

  function turnHtml() {
    const t = st.turn;
    if (!t) return "";
    if (t.player !== "You") {
      return '<div class="turn muted">Waiting for <b>' + esc(t.player) + "</b> to " + (t.type === "pick" ? "pick" : "claim or decline") + "&hellip;" + timerHtml() + "</div>";
    }
    if (t.type === "pick") {
      return '<div class="turn"><b>It\'s your pick.</b> You\'re next in line. Choose one item (you\'ll drop to the bottom), or skip, which is always free.' +
        '<div class="row" style="margin-top:8px">' + t.options.map((id) => '<button class="primary" data-act="pick" data-a="' + id + '">Claim ' + itemName(id) + "</button>").join("") +
        '<button data-act="skip">Skip my turn</button></div>' + timerHtml() + "</div>";
    }
    return '<div class="turn"><b>Offered to you from the bottom up:</b> <span class="iname">' + itemName(t.item) + "</span>. " +
      "Claiming costs you almost nothing at the bottom. You can keep it, or gift it up to someone who can use it." +
      '<div class="row" style="margin-top:8px"><button class="primary" data-act="claim" data-a="">Claim it</button>' +
      '<button data-act="claimGift">Claim and gift to</button>' + giftSelect() + '<button data-act="decline">Decline</button></div>' + timerHtml() + "</div>";
  }

  function giftSelect() {
    const names = (st.players || []).map((p) => p.name).filter((n) => n !== "You");
    if (!giftTo || names.indexOf(giftTo) < 0) giftTo = names[0] || "";
    return '<select id="giftTo">' + names.map((n) => '<option' + (n === giftTo ? " selected" : "") + ">" + esc(n) + "</option>").join("") + "</select>";
  }

  function itemsHtml() {
    const bidding = st.phase === "bidding";
    const mine = (st.players || []).filter((p) => p.name === "You")[0];
    let h = '<table><tr><th>Item</th><th>Status</th>' + (bidding ? "<th>Your answer</th>" : "") + "</tr>";
    st.items.forEach((it, i) => {
      let status = '<span class="pill wait">open</span>';
      if (it.status === "awarded") status = '<span class="pill win">' + esc(it.winner) + (it.to !== it.winner ? " &rarr; " + esc(it.to) : "") + " (" + it.tier + ")</span>";
      else if (it.status === "de") status = '<span class="pill">disenchant</span>';
      let ans = "";
      if (bidding) {
        const a = mine && mine.answers[i];
        const b = (k, label) => '<button class="b-' + k + (a && a.kind === k ? " sel" : "") + '" data-act="bid" data-a="' + it.id + '" data-b="' + k + '">' + label + "</button>";
        const ready = it.token ? '<button class="b-need' + (a && a.kind === "need" && a.ready ? " sel" : "") + '" data-act="bid" data-a="' + it.id + '" data-b="needready" title="Need it, and you can turn it in (say so if your materials are in the bank)">Need, ready</button>' : "";
        ans = '<td><div class="row">' + b("need", "Need") + ready + b("off", "Off") + b("gift", "Gift") + b("pass", "Pass") + "</div></td>";
      }
      h += '<tr><td><span class="iname">' + esc(it.link) + "</span>" + tokenHtml(it) + "</td><td>" + status + "</td>" + ans + "</tr>";
    });
    return h + "</table>" + (bidding ? '<div class="row small" style="margin-top:6px"><span class="muted">Gift to:</span>' + giftSelect() + '<button data-act="passAll">Pass on everything</button></div>' : "");
  }

  function playersHtml() {
    let h = '<table><tr><th>Who\'s answered</th>' + st.items.map((it) => '<th class="small">' + esc(it.link.split(" ")[0]) + "&hellip;</th>").join("") + "</tr>";
    (st.players || []).forEach((p) => {
      h += '<tr class="' + (p.name === "You" ? "you" : "") + '"><td>' + esc(p.name) + "</td>" + p.answers.map((a) => "<td>" + chip(a) + "</td>").join("") + "</tr>";
    });
    return h + "</table>";
  }

  function standingsHtml(order, title) {
    if (!order || !order.length) return "";
    return '<div class="card"><h2>' + title + '</h2><ol class="stand">' + order.map((n, i) =>
      '<li class="' + (n === "You" ? "you " : "") + (moved[n] && title === "Standings" ? "moved" : "") + '"><span class="n">' + (i + 1) + "</span><span>" + esc(n) + "</span></li>").join("") + "</ol></div>";
  }

  function pendingHtml() {
    if (!st.pending || !st.pending.length) return "";
    return '<div class="card"><h2>Will be recorded</h2>' + st.pending.map((a) => {
      if (a.type === "award") return "<div class=\"small\">" + esc(a.member) + " wins <span class=\"iname\">" + esc(a.item) + "</span> (" + a.tier + ")" + (a.to !== a.member ? " &rarr; " + esc(a.to) : "") + "</div>";
      if (a.type === "disenchant") return "<div class=\"small\"><span class=\"iname\">" + esc(a.item) + "</span> goes to " + esc(a.to) + " to disenchant</div>";
      return "<div class=\"small muted\">" + esc(a.member) + " joins the " + esc(a.list) + " list</div>";
    }).join("") + (st.phase === "review" ? '<div class="small muted" style="margin-top:6px">Nothing is written to the ledger until you confirm.</div>' : "") + "</div>";
  }

  function controlsHtml() {
    const p = st.phase;
    let h = '<div class="row" style="margin-top:10px">';
    if (p === "bidding") h += '<button data-act="extend" data-a="30">+30s</button><button data-act="resolveNow">Resolve now</button>';
    if (p === "review") h += '<button class="primary" data-act="confirm">Confirm &amp; distribute</button>';
    if (p === "done") h += '<button data-act="undo">Undo last award</button>';
    const n = st.night;
    if (n && (p === "idle" || p === "done" || p === "cancelled")) {
      if (n.next) {
        h += '<button class="primary" data-act="kill" data-a="0">Kill ' + esc(n.next) + ', hand out now</button>';
        h += '<button data-act="kill" data-a="1">Kill ' + esc(n.next) + ', hold the loot</button>';
      }
      if (n.held.length) h += '<button class="primary" data-act="handout">Hand out held loot (' + n.held.length + ')</button>';
      if (!n.next && !n.held.length) h += '<span class="muted small">' + esc(n.last) + " is dead. The raid is cleared.</span>";
    }
    h += "</div>";
    if (n && n.held.length) h += '<div class="small muted" style="margin-top:6px">Held: ' + n.held.map(esc).join(", ") + "</div>";
    return h;
  }

  function resultHtml() {
    if (st.phase !== "done" || st.night) return "";
    result = result || call("check");
    return '<div class="card ' + (result.ok ? "good" : "bad") + '"><h2>' + (result.ok ? "Matches the lesson" : "Different from the lesson") + "</h2><div>" + esc(result.message || "") +
      '</div><div class="row" style="margin-top:8px"><button data-act="again">Run it again</button><button data-act="next" class="primary">Next scenario</button></div></div>';
  }

  function render() {
    if (!st) return;
    const sideScen = scenarios.map((s) => '<button class="scen ' + (s.id === current ? "on" : "") + '" data-act="scenario" data-a="' + s.id + '">' + esc(s.title) + "</button>").join("");
    const lesson = st.lesson ? '<div class="card"><h2>' + esc(st.lesson.title) + "</h2><div>" + esc(st.lesson.text) + "</div></div>" : "";
    $("#app").innerHTML =
      '<div class="layout"><div>' +
        '<div class="card"><h2>Scenarios</h2>' + sideScen + "</div>" +
        '<div class="card"><h2>Time</h2><div class="row"><button data-act="toggle">' + (running ? "Pause" : "Run") + "</button>" +
          [1, 4, 16].map((s) => '<button data-act="speed" data-a="' + s + '" class="' + (speed === s ? "sel" : "") + '">' + s + "x</button>").join("") + "</div>" +
          '<div class="small muted" style="margin-top:6px">Simulated clock: ' + st.now.toFixed(0) + 's<br>Ledger head: <code>' + esc(st.head.slice(0, 8)) + "</code></div></div>" +
      "</div><div>" + lesson +
        '<div class="card"><div class="row spread"><h2 style="margin:0">Master Looter</h2><span class="pill phase">' + (PHASE[st.phase] || st.phase) + "</span></div>" +
          (st.phase === "bidding" ? '<div class="small muted" style="margin:6px 0">' + st.answered + " of " + st.eligible + " eligible players have answered every item. Bidding closes when everyone has, or the timer ends." + timerHtml() + "</div>" : "") +
          turnHtml() + itemsHtml() + controlsHtml() + (lastMsg ? '<div class="small" style="color:var(--bad);margin-top:6px">' + esc(lastMsg) + "</div>" : "") + "</div>" +
        resultHtml() + pendingHtml() +
        '<div class="card"><h2>Answers (public)</h2>' + playersHtml() + "</div>" +
      "</div><div>" + standingsHtml(st.order, "Standings") + standingsHtml(st.offOrder, "Off-spec list") +
        '<div class="card"><h2>History</h2><div class="log">' + (st.log.length ? st.log.map((l) => "<div>" + esc(l.text) + "</div>").join("") : '<span class="muted small">Nothing recorded yet.</span>') + "</div></div>" +
      "</div></div>";
  }

  let tab = "loot", lab = null;
  function labCall(name, a, b) {
    lab = call(name, a, b);
    renderLab();
  }
  function renderLab() {
    if (!lab || tab !== "lab") return;
    const cls = { "in sync": "good", behind: "warn", diverged: "bad" };
    const peers = lab.peers.map((p) =>
      '<div class="card peer ' + cls[p.status] + '"><div class="row spread"><b>' + esc(p.name) + '</b><span class="pill ' + cls[p.status] + '">' + p.status + "</span></div>" +
      '<div class="small muted">' + p.count + " events · head <code>" + esc(p.head) + "</code></div>" +
      '<ul class="mini">' + p.order.map((n, i) => "<li>" + (i + 1) + ". " + esc(n) + "</li>").join("") + (p.members > p.order.length ? "<li>&hellip; " + p.members + " on the list</li>" : "") + "</ul>" +
      (p.pending ? '<div class="small" style="color:var(--warn)">' + p.pending + " messages waiting to send" + (p.blocked ? " (" + esc(p.blocked) + ")" : "") + "</div>" : "") +
      (p.orphans ? '<div class="small" style="color:var(--warn)">' + p.orphans + " of this player's events were set aside after a fork</div>" : "") +
      (p.rejected ? '<div class="small" style="color:var(--bad)">' + p.rejected + " bad events rejected</div>" : "") +
      '<div class="row" style="margin-top:8px"><button data-act="lab-write" data-a="' + p.index + '" data-b="member">+ member</button><button data-act="lab-write" data-a="' + p.index + '" data-b="award">+ award</button>' +
      '<button data-act="lab-restrict" data-a="' + p.index + '" data-b="' + (p.restricted ? 0 : 1) + '" class="' + (p.restricted ? "sel" : "") + '">' + (p.restricted ? "Restricted" : "Restrict") + "</button></div></div>").join("");
    const pct = (v) => Math.round(v * 100);
    const netBtn = (label, drop, dup) => '<button data-act="lab-net" data-a="' + drop + '" data-b="' + dup + '" class="' + (pct(lab.drop) === pct(drop) && pct(lab.dup) === pct(dup) ? "sel" : "") + '">' + label + "</button>";
    $("#lab").innerHTML =
      '<p class="sub">Several real engines, each with its own copy of the ledger, joined by a simulated network. Write at any player, break the network, and watch them find each other again. Each player writes on their own chain, and everyone merges all chains in the same order. Green = matches what most of the group has; amber = only missing events; red = has events the others have not seen yet.</p>' +
      '<div class="card"><h2>Network</h2><div class="row">' +
        '<button data-act="lab-split" data-a="1|234">Split: Aldric alone</button><button data-act="lab-split" data-a="12|34">Split: Aldric+Brann | Cass+Dara</button><button class="primary" data-act="lab-heal">Heal</button>' +
        '<span class="muted small">Lost:</span>' + netBtn("0%", 0, lab.dup) + netBtn("20%", 0.2, lab.dup) + netBtn("40%", 0.4, lab.dup) +
        '<span class="muted small">Duplicated:</span>' + netBtn("0%", lab.drop, 0) + netBtn("50%", lab.drop, 0.5) +
        '<button data-act="lab-join"' + (lab.canAdd ? "" : " disabled") + '>A late player logs in</button><button data-act="lab-reset">Reset</button></div>' +
        '<div class="row small muted" style="margin-top:8px"><button data-act="toggle">' + (running ? "Pause" : "Run") + "</button>" +
        [1, 4, 16].map((s) => '<button data-act="speed" data-a="' + s + '" class="' + (speed === s ? "sel" : "") + '">' + s + "x</button>").join("") +
        "<span>Clock " + lab.time.toFixed(0) + "s · " + lab.inFlight + " messages in flight · " + lab.stats.sent + " sent, " + lab.stats.dropped + " lost, " + lab.stats.blocked + " blocked by the split" +
        (lab.split ? " · <b>split: " + esc(lab.split) + "</b>" : "") + "</span></div></div>" +
      '<div class="peers">' + peers + "</div>" +
      '<div class="layout" style="grid-template-columns: 1fr 1fr"><div class="card"><h2>What happened</h2><div class="log">' +
        (lab.log.length ? lab.log.slice().reverse().map((l) => "<div><span class=\"muted small\">" + l.t.toFixed(0) + "s</span> " + esc(l.text) + "</div>").join("") : '<span class="muted small">Nothing yet.</span>') + "</div></div>" +
      '<div class="card"><h2>Try this</h2>' +
        '<p class="hint"><b>Split, then heal.</b> Split Aldric alone, add two awards at Aldric and three members at Cass, then Heal. Each player writes on their own chain, so after healing the changes from both sides are merged in time order and nothing is set aside.</p>' +
        '<p class="hint"><b>Late joiner.</b> Write a few events, then let a late player log in. Watch them catch up from nothing.</p>' +
        '<p class="hint"><b>Lost messages.</b> Set 40% lost, write several events, and watch the group repair itself from the heartbeats.</p>' +
        '<p class="hint"><b>Boss fight.</b> Restrict Aldric, write at Aldric, and see the messages wait. Lift the restriction and they go out.</p></div></div>';
  }

  function showTab(t) {
    tab = t;
    $("#app").hidden = t !== "loot";
    $("#lab").hidden = t !== "lab";
    $("#tab-loot").classList.toggle("on", t === "loot");
    $("#tab-lab").classList.toggle("on", t === "lab");
    if (t === "lab") labCall("lab_state");
  }

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el || !st) return;
    const a = el.dataset.a, b = el.dataset.b;
    switch (el.dataset.act) {
      case "tab": showTab(a); return;
      case "lab-write": labCall("lab_write", a, b); return;
      case "lab-split": labCall("lab_partition", a); return;
      case "lab-heal": labCall("lab_heal"); return;
      case "lab-net": labCall("lab_net", a, b); return;
      case "lab-restrict": labCall("lab_restrict", a, b); return;
      case "lab-join": labCall("lab_join"); return;
      case "lab-reset": labCall("lab_reset"); return;
      case "scenario": seed = 1; start(a); break;
      case "again": seed += 1; start(current); break;
      case "next": { const i = scenarios.findIndex((s) => s.id === current); seed = 1; start(scenarios[(i + 1) % scenarios.length].id); break; }
      case "toggle": running = !running; render(); renderLab(); break;
      case "speed": speed = Number(a); render(); renderLab(); break;
      case "bid": act("bid", a, b, b === "gift" ? giftTo : ""); break;
      case "claimGift": act("claim", giftTo); break;
      case "claim": act("claim", ""); break;
      default: act(el.dataset.act, a, b);
    }
  });
  document.addEventListener("change", (e) => { if (e.target.id === "giftTo") giftTo = e.target.value; });

  setInterval(() => {
    if (tab === "lab") { if (running && lab) labCall("lab_advance", speed * 0.25); return; }
    if (!st || !running || ["review", "done", "cancelled"].indexOf(st.phase) >= 0) return;
    st = call("advance", speed * 0.25);
    updateMoved();
    render();
  }, 250);

  window.addEventListener("load", () => {
    if (!window.KG) { $("#app").innerHTML = '<div class="loading">The engine did not start. Check your connection (the page loads a Lua runtime from a CDN).</div>'; return; }
    scenarios = call("scenarios");
    start(current);
  });
})();
</script>
</body>
</html>
