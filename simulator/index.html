<script type="application/lua">
-- Generated by scripts/build-simulator.lua from src/KingsGambit/. Do not edit.

function SK:NewModule(n) local m = { name = n }; self.modules[n] = m; return m end

-- ===== Hash.lua =====
do local chunk = function(...)
-- King's Gambit: deterministic hashing and canonical serialization (Phase 1).
-- Pure Lua (no WoW API) so the ledger can be tested outside the game.
--
-- Not cryptographic: the trust model is trusted officers + a hash chain that
-- catches mistakes, dropped messages and desync (see docs/kings-gambit/).
local _, SK = ...
local M = SK:NewModule("Hash")

local TWO32 = 4294967296
local PRIME = 16777619 -- FNV-1a 32-bit prime

-- XOR of two 4-bit values, tabulated once. Byte XOR is then two lookups. This is used on every
-- runtime instead of a bit library, so hashes are identical everywhere (game, tests, browser)
-- and there is no per-byte function call.
local XOR4 = {}
for a = 0, 15 do
    for b = 0, 15 do
        local r, p, x, y = 0, 1, a, b
        for _ = 1, 4 do
            local xa, yb = x % 2, y % 2
            if xa ~= yb then r = r + p end
            x, y, p = (x - xa) / 2, (y - yb) / 2, p * 2
        end
        XOR4[a * 16 + b] = r
    end
end

-- h XOR b for a 32-bit h and a byte b (only the low byte of h changes).
local function xorByte(h, b)
    local lo = h % 256
    local al = lo % 16
    local bl = b % 16
    return h - lo + XOR4[(lo - al) / 16 * 16 + (b - bl) / 16] * 16 + XOR4[al * 16 + bl]
end

-- h * PRIME mod 2^32 without exceeding double precision (split into 16-bit halves).
local function mul32(h)
    local lo = h % 65536
    local hi = (h - lo) / 65536
    return (((hi * PRIME) % 65536) * 65536 + lo * PRIME) % TWO32
end

local function fnv(str, h)
    for i = 1, #str do
        h = mul32(xorByte(h, str:byte(i)))
    end
    return h
end

-- 8 hex digits of a 32-bit value held in a float. string.format("%x") is avoided on purpose:
-- some Lua runtimes (e.g. fengari, which runs in browsers) have 32-bit integers and refuse
-- values of 2^31 and above.
local HEX = "0123456789abcdef"
local function hex8(n)
    local out = {}
    for i = 8, 1, -1 do
        local d = n % 16
        out[i] = HEX:sub(d + 1, d + 1)
        n = (n - d) / 16
    end
    return table.concat(out)
end

-- 64 bits as 16 hex chars (two FNV-1a passes with different seeds).
function M.Sum(str)
    return hex8(fnv(str, 2166136261.0)) .. hex8(fnv(str, 2654435761.0))
end

local function keyLess(a, b)
    local ta, tb = type(a), type(b)
    if ta ~= tb then return ta < tb end
    return a < b
end

-- Canonical string for a value: same data => same string, regardless of key order.
function M.Canon(v)
    local t = type(v)
    if t == "string" then
        return "s" .. #v .. ":" .. v
    elseif t == "number" then
        if v ~= v or v == math.huge or v == -math.huge then error("Canon: non-finite number") end
        if v == math.floor(v) and v > -9007199254740992 and v < 9007199254740992 then
            if v == 0 then return "n0" end
            return ("n%.0f"):format(v) -- same text as %d, but safe for values beyond 32 bits
        end
        return ("n%.17g"):format(v)
    elseif t == "boolean" then
        return v and "T" or "F"
    elseif t == "nil" then
        return "~"
    elseif t == "table" then
        local keys = {}
        for k in pairs(v) do
            local kt = type(k)
            if kt ~= "string" and kt ~= "number" then error("Canon: bad key type " .. kt) end
            keys[#keys + 1] = k
        end
        table.sort(keys, keyLess)
        local out = { "{" }
        for _, k in ipairs(keys) do
            out[#out + 1] = M.Canon(k) .. "=" .. M.Canon(v[k]) .. ","
        end
        out[#out + 1] = "}"
        return table.concat(out)
    end
    error("Canon: unsupported type " .. t)
end

-- Inverse of Canon. Returns the value, or nil + "malformed".
function M.Decode(s)
    if type(s) ~= "string" then return nil, "malformed" end
    local pos = 1
    local function value()
        local c = s:sub(pos, pos)
        if c == "s" then
            local colon = s:find(":", pos, true)
            local len = colon and tonumber(s:sub(pos + 1, colon - 1))
            if not len or colon + len > #s then error("bad string") end
            local str = s:sub(colon + 1, colon + len)
            pos = colon + len + 1
            return str
        elseif c == "n" then
            local e = s:find("[=,}]", pos) or (#s + 1)
            local n = tonumber(s:sub(pos + 1, e - 1))
            if not n then error("bad number") end
            pos = e
            return n
        elseif c == "T" then pos = pos + 1; return true
        elseif c == "F" then pos = pos + 1; return false
        elseif c == "~" then pos = pos + 1; return nil
        elseif c == "{" then
            pos = pos + 1
            local t = {}
            while s:sub(pos, pos) ~= "}" do
                local k = value()
                if k == nil or s:sub(pos, pos) ~= "=" then error("bad key") end
                pos = pos + 1
                t[k] = value()
                if s:sub(pos, pos) ~= "," then error("bad separator") end
                pos = pos + 1
            end
            pos = pos + 1
            return t
        end
        error("bad token")
    end
    local ok, v = pcall(value)
    if not ok or pos ~= #s + 1 then return nil, "malformed" end
    return v
end

end; chunk("KingsGambit", SK) end
-- ===== Standings.lua =====
do local chunk = function(...)
-- King's Gambit: deterministic replay of ledger events into standings (Phase 1).
-- Pure Lua. order[1] is the TOP of the list (first to win); winners drop to the bottom.
--
-- Apply validates BEFORE it mutates, so a rejected event never changes state.
local _, SK = ...
local M = SK:NewModule("Standings")
local Hash = SK.modules.Hash

function M.New()
    return {
        created = false,
        name = nil,
        order = {},   -- member names, top first
        members = {}, -- [name] = { class, active, wins, passes, upgradePasses, lastWinSeq, lastWinTs, joinedSeq }
        awards = {},  -- [eventId] = { member, to, item, reverted }
        undo = {},    -- stack of reversible Awards (cleared by anything that shifts positions)
        count = 0,    -- events applied
    }
end

local function isName(v) return type(v) == "string" and v ~= "" end

local function indexOf(order, name)
    for i = 1, #order do
        if order[i] == name then return i end
    end
end

-- Resolve a position spec to a final 1-based index in 1..maxPos (nil = bottom).
local function resolvePos(pos, maxPos)
    if pos == nil or pos == "bottom" then return maxPos end
    if pos == "top" then return 1 end
    if type(pos) == "number" and pos == math.floor(pos) and pos >= 1 and pos <= maxPos then return pos end
end

local handlers = {}

function handlers.CreateList(s, ev, d)
    if not isName(d.name) then return nil, "badname" end
    s.created, s.name = true, d.name
    return true
end

function handlers.AddMember(s, ev, d)
    if not isName(d.member) then return nil, "badmember" end
    local m = s.members[d.member]
    if m and m.active then return nil, "alreadymember" end
    local idx = resolvePos(d.pos, #s.order + 1)
    if not idx then return nil, "badpos" end
    if idx <= #s.order then s.undo = {} end -- inserting above others shifts their positions
    table.insert(s.order, idx, d.member)
    if m then
        m.active = true
        m.class = d.class or m.class
    else
        s.members[d.member] = { class = d.class, active = true, wins = 0, passes = 0, upgradePasses = 0, joinedSeq = ev.seq }
    end
    return true
end

function handlers.RemoveMember(s, ev, d)
    local m = s.members[d.member]
    if not (isName(d.member) and m and m.active) then return nil, "notmember" end
    table.remove(s.order, indexOf(s.order, d.member))
    m.active = false
    s.undo = {}
    return true
end

-- A win: the winner drops to the bottom. `to` (optional) is who actually receives the item (gifting).
function handlers.Award(s, ev, d)
    local m = s.members[d.member]
    if not (isName(d.member) and m and m.active) then return nil, "notmember" end
    if not isName(d.item) then return nil, "baditem" end
    if d.to ~= nil and not isName(d.to) then return nil, "badrecipient" end
    local idx = indexOf(s.order, d.member)
    table.remove(s.order, idx)
    s.order[#s.order + 1] = d.member
    s.undo[#s.undo + 1] = { id = ev.id, member = d.member, idx = idx,
        wins = m.wins, lastWinSeq = m.lastWinSeq, lastWinTs = m.lastWinTs }
    m.wins, m.lastWinSeq, m.lastWinTs = m.wins + 1, ev.seq, ev.ts
    s.awards[ev.id] = { member = d.member, to = d.to or d.member, item = d.item }
    return true
end

-- A pass changes no position; it only feeds the transparency stats.
function handlers.Pass(s, ev, d)
    local m = s.members[d.member]
    if not (isName(d.member) and m and m.active) then return nil, "notmember" end
    if not isName(d.item) then return nil, "baditem" end
    m.passes = m.passes + 1
    if d.kind == "upgrade" then m.upgradePasses = m.upgradePasses + 1 end
    return true
end

-- Re-route where an awarded item went (post-award gift target correction). No position change.
function handlers.Transfer(s, ev, d)
    local a = s.awards[d.award]
    if not a or a.reverted then return nil, "noaward" end
    if not isName(d.to) then return nil, "badrecipient" end
    a.to = d.to
    return true
end

-- Nobody wanted the item: it went to the disenchanter (and from there to the guild bank). No position change.
function handlers.Disenchant(s, ev, d)
    if not isName(d.item) then return nil, "baditem" end
    if not isName(d.to) then return nil, "badrecipient" end
    return true
end

local SALVAGE_ACTIONS = { keep = true, gift = true, sell = true, disenchant = true, bank = true }

-- What the player who claimed a backstop item did with it. Recorded for transparency only.
function handlers.Salvage(s, ev, d)
    local a = s.awards[d.award]
    if not a or a.reverted then return nil, "noaward" end
    if not SALVAGE_ACTIONS[d.action] then return nil, "badaction" end
    a.salvage = d.action
    return true
end

-- Officer correction: place a member at an explicit position. A reason is mandatory.
function handlers.MovePlayer(s, ev, d)
    local m = s.members[d.member]
    if not (isName(d.member) and m and m.active) then return nil, "notmember" end
    if not isName(d.reason) then return nil, "noreason" end
    local idx = resolvePos(d.pos, #s.order)
    if not idx then return nil, "badpos" end
    table.remove(s.order, indexOf(s.order, d.member))
    table.insert(s.order, idx, d.member)
    s.undo = {}
    return true
end

-- Exact undo of the most recent Award (only while nothing has shifted positions since).
function handlers.Revert(s, ev, d)
    local top = s.undo[#s.undo]
    if not top or top.id ~= d.target then return nil, "notrevertible" end
    local m = s.members[top.member]
    table.remove(s.order, indexOf(s.order, top.member))
    table.insert(s.order, top.idx, top.member)
    m.wins, m.lastWinSeq, m.lastWinTs = top.wins, top.lastWinSeq, top.lastWinTs
    s.awards[top.id].reverted = true
    s.undo[#s.undo] = nil
    return true
end

-- Validate and apply one event. Returns true, or nil + reason (state untouched).
function M.Apply(s, ev)
    if ev.seq ~= s.count + 1 then return nil, "badseq" end
    if type(ev.ts) ~= "number" then return nil, "badts" end
    if not isName(ev.author) then return nil, "badauthor" end
    if type(ev.data) ~= "table" then return nil, "baddata" end
    local h = handlers[ev.type]
    if not h then return nil, "unknowntype" end
    if ev.type == "CreateList" then
        if s.created then return nil, "alreadycreated" end
    elseif not s.created then
        return nil, "nolist"
    end
    local ok, err = h(s, ev, ev.data)
    if not ok then return nil, err end
    s.count = s.count + 1
    return true
end

-- Rebuild standings from an event array. On failure: nil, reason, index of the bad event.
function M.Replay(events)
    local s = M.New()
    for i, ev in ipairs(events) do
        local ok, err = M.Apply(s, ev)
        if not ok then return nil, err, i end
    end
    return s
end

function M.Position(s, name) return indexOf(s.order, name) end

-- Fingerprint of the current ordering (compare standings independent of history).
function M.Digest(s) return Hash.Sum(Hash.Canon(s.order)) end

end; chunk("KingsGambit", SK) end
-- ===== Ledger.lua =====
do local chunk = function(...)
-- King's Gambit: append-only, hash-chained event log per list (Phase 1).
--
-- Event: { v, list, seq, prev, ts, author, type, data, id }
--   id = Hash(prev .. "|" .. Canon{v,list,seq,ts,author,type,data})
-- Each event commits to its predecessor, so the head id fingerprints the whole history.
-- Receive() is the only way events enter a chain (local Append builds then Receives),
-- so local and remote events pass identical validation. Idempotent by event id.
local _, SK = ...
local M = SK:NewModule("Ledger")
local Hash = SK.modules.Hash
local Standings = SK.modules.Standings

M.GENESIS = "0000000000000000"
M.VERSION = 1

local function eventId(ev)
    return Hash.Sum(ev.prev .. "|" .. Hash.Canon({
        v = ev.v, list = ev.list, seq = ev.seq, ts = ev.ts,
        author = ev.author, type = ev.type, data = ev.data,
    }))
end
M.EventId = eventId

function M.NewChain(listId)
    return { list = listId, events = {}, byId = {}, head = M.GENESIS, state = Standings.New() }
end

-- Validate and add an event. Returns "appended" | "duplicate", or nil + reason:
--   malformed, wronglist, badversion, badhash, gap (missing earlier events),
--   fork (same slot, different history), or a Standings rejection reason.
function M.Receive(chain, ev)
    if type(ev) ~= "table" or type(ev.id) ~= "string" or type(ev.seq) ~= "number"
        or type(ev.prev) ~= "string" or type(ev.data) ~= "table" then
        return nil, "malformed"
    end
    if chain.byId[ev.id] then return "duplicate" end
    if ev.list ~= chain.list then return nil, "wronglist" end
    if ev.v ~= M.VERSION then return nil, "badversion" end
    local okHash, id = pcall(eventId, ev)
    if not okHash or id ~= ev.id then return nil, "badhash" end
    local n = #chain.events
    if ev.seq > n + 1 then return nil, "gap" end
    if ev.seq <= n or ev.prev ~= chain.head then return nil, "fork" end
    local ok, err = Standings.Apply(chain.state, ev)
    if not ok then return nil, err end
    chain.events[ev.seq] = ev
    chain.byId[ev.id] = ev
    chain.head = ev.id
    return "appended"
end

-- Author a new event on top of the chain head.
function M.Append(chain, type_, data, author, ts)
    local ev = { v = M.VERSION, list = chain.list, seq = #chain.events + 1, prev = chain.head,
        ts = ts, author = author, type = type_, data = data or {} }
    local okHash, id = pcall(eventId, ev)
    if not okHash then return nil, "malformed" end
    ev.id = id
    local status, err = M.Receive(chain, ev)
    if status ~= "appended" then return nil, err end
    return ev
end

-- Rebuild a chain from stored events, verifying every hash and rule.
-- Returns chain, or nil + reason + index of the first bad event.
function M.Load(listId, events)
    local chain = M.NewChain(listId)
    for i, ev in ipairs(events) do
        local status, err = M.Receive(chain, ev)
        if status ~= "appended" then return nil, err or status, i end
    end
    return chain
end


-- Fast load for large stored ledgers: structure, linkage (seq and prev) and rules are checked
-- and the standings are rebuilt, but event hashes are NOT recomputed. Call VerifyStep until it
-- reports "done" to verify them in slices. Returns chain, or nil + reason + index.
function M.LoadFast(listId, events)
    local chain = M.NewChain(listId)
    for i, ev in ipairs(events) do
        if type(ev) ~= "table" or type(ev.id) ~= "string" or type(ev.prev) ~= "string" or type(ev.data) ~= "table"
            or ev.seq ~= i or ev.prev ~= chain.head or ev.list ~= listId or ev.v ~= M.VERSION then
            return nil, "malformed", i
        end
        local ok, err = Standings.Apply(chain.state, ev)
        if not ok then return nil, err, i end
        chain.events[i] = ev
        chain.byId[ev.id] = ev
        chain.head = ev.id
    end
    chain.verified = 0
    return chain
end

-- Recompute the hashes of the next `count` unverified events. Returns "more", "done", or
-- "bad" plus the index of the first event whose hash does not match.
function M.VerifyStep(chain, count)
    local from = (chain.verified or #chain.events) + 1
    local to = math.min(from + count - 1, #chain.events)
    for i = from, to do
        local ev = chain.events[i]
        local ok, id = pcall(eventId, ev)
        if not ok or id ~= ev.id then return "bad", i end
    end
    chain.verified = to
    return (to >= #chain.events) and "done" or "more"
end

end; chunk("KingsGambit", SK) end

do local chunk = function(...)
-- King's Gambit: the Client contract (Phase 1.5).
-- The Client is the only way the engine touches the WoW API. This file lists what a Client
-- must provide so RealClient, MockClient and SimClient can be checked against the same contract.
-- Design: docs/kings-gambit/client-interface.md
local _, SK = ...
local M = SK:NewModule("Client")

-- Methods are called with a colon: client:now(), client:send(...).
M.METHODS = {
    -- time and randomness
    "now", "serverTime", "after", "every", "cancel", "random",
    -- identity and roster
    "me", "normalize", "inGroup", "inRaid", "roster", "rankOf", "guildRoster",
    -- loot
    "lootMethod", "isMasterLooter", "lootSlots", "candidates", "give", "itemInfo",
    -- communication
    "registerPrefix", "send", "pending", "whisper", "announce", "serialize", "deserialize",
    -- trade
    "trade", "tradeableUntil",
    -- environment and storage
    "storage", "playSound", "print", "log",
    -- events
    "on",
}

M.EVENTS = {
    "roster.changed", "lootMethod.changed",
    "loot.opened", "loot.slotCleared", "loot.closed",
    "comms.received", "whisper.received",
    "trade.changed", "trade.closed",
    "encounter.ended", "world.entered",
    "item.info", "comms.restrictionChanged",
}

local eventSet = {}
for _, e in ipairs(M.EVENTS) do eventSet[e] = true end

function M.IsEvent(name) return eventSet[name] == true end

-- Names a client is missing from the contract (empty list = conforms).
function M.Missing(client)
    local missing = {}
    for _, name in ipairs(M.METHODS) do
        if type(client[name]) ~= "function" then missing[#missing + 1] = name end
    end
    if type(client.caps) ~= "table" then missing[#missing + 1] = "caps" end
    if type(client.maxMessage) ~= "number" then missing[#missing + 1] = "maxMessage" end
    return missing
end

-- Shared event dispatch for every Client implementation (Mock, Real, Sim).
-- on() returns an unsubscribe function; unknown event names are errors.
function M.NewBus()
    local handlers = {}
    local bus = {}
    function bus.on(event, fn)
        assert(M.IsEvent(event), "unknown client event: " .. tostring(event))
        local list = handlers[event]
        if not list then list = {}; handlers[event] = list end
        local entry = { fn = fn, active = true }
        list[#list + 1] = entry
        return function() entry.active = false end
    end
    function bus.emit(event, payload)
        assert(M.IsEvent(event), "unknown client event: " .. tostring(event))
        local list = handlers[event]
        if not list then return end
        local snapshot = {}
        for i, e in ipairs(list) do snapshot[i] = e end
        for _, e in ipairs(snapshot) do
            if e.active then e.fn(payload) end
        end
    end
    function bus.clear() handlers = {} end
    return bus
end

end; chunk("KingsGambit", SK) end
-- ===== MockClient.lua =====
do local chunk = function(...)
-- King's Gambit: MockClient, a headless fake of the WoW API (Phase 1.5).
-- Runs under plain Lua and inside the game. Time, randomness, raid, loot, comms and
-- trades are all scripted by the test (or training scenario) through the control
-- methods below. Keep this file Lua 5.1-safe (no `//`, no bitwise operators).
-- Design: docs/kings-gambit/client-interface.md
local _, SK = ...
local M = SK:NewModule("MockClient")
local Hash = SK.modules.Hash
local Client = SK.modules.Client

local CHANNELS = { RAID = true, PARTY = true, GUILD = true, WHISPER = true }
local PM_MOD = 2147483647 -- Park-Miller: state * 16807 stays below 2^53, so it is exact

local function copyList(t)
    local out = {}
    for i, v in ipairs(t) do
        if type(v) == "table" then
            local c = {}
            for k, x in pairs(v) do c[k] = x end
            out[i] = c
        else
            out[i] = v
        end
    end
    return out
end

-- opts: name, realm, seed, clock (start of now()), unix (start of serverTime()).
function M.New(opts)
    opts = opts or {}
    local realm = opts.realm or "Realm"
    local function normalize(name)
        if type(name) ~= "string" or name == "" then return nil end
        if name:find("-", 1, true) then return name end
        return name .. "-" .. realm
    end

    local clock = opts.clock or 1000
    local clock0, unix0 = clock, opts.unix or 1760000000
    local seed = ((opts.seed or 1) % PM_MOD) + 0.0 -- float: exact, and no 32-bit integer overflow on any runtime
    if seed == 0 then seed = 1 end

    local S = {
        me = normalize(opts.name or "Tester"),
        timers = {}, nextTimer = 1, restricted = false,
        prefixes = {},
        roster = {}, guild = {}, inRaid = false, lootMethod = "group", masterLooter = nil,
        loot = { open = false, slots = {} },
        items = {}, pendingInfo = {}, tradeable = {}, trade = nil,
        storage = { account = {}, char = {} },
    }

    local bus = Client.NewBus()

    local h = {
        caps = { masterLoot = true, trade = true, comms = true, guild = true },
        maxMessage = 255,
        sent = {},    -- everything the client tried to send
        given = {},   -- loot handed out through give()
        printed = {}, logs = {}, sounds = {},
        onSend = nil, -- SimNetwork hooks in here: function(client, message)
        pendingCount = 0,
    }

    ---------------------------------------------------------------- time
    function h:now() return clock end
    function h:serverTime() return unix0 + math.floor(clock - clock0) end

    function h:after(sec, fn)
        local t = { id = S.nextTimer, due = clock + sec, fn = fn }
        S.nextTimer = S.nextTimer + 1
        S.timers[#S.timers + 1] = t
        return t
    end

    function h:every(sec, fn)
        assert(sec > 0, "every: interval must be positive")
        local t = { id = S.nextTimer, due = clock + sec, interval = sec, fn = fn }
        S.nextTimer = S.nextTimer + 1
        S.timers[#S.timers + 1] = t
        return t
    end

    function h:cancel(handle)
        if handle then handle.cancelled = true end
    end

    -- Move the clock forward, firing due timers in order (each sees the right now()).
    function h:advance(sec)
        local target = clock + sec
        while true do
            local nxt
            for _, t in ipairs(S.timers) do
                if not t.cancelled and t.due <= target
                    and (not nxt or t.due < nxt.due or (t.due == nxt.due and t.id < nxt.id)) then
                    nxt = t
                end
            end
            if not nxt then break end
            if nxt.due > clock then clock = nxt.due end
            if nxt.interval then nxt.due = nxt.due + nxt.interval else nxt.cancelled = true end
            nxt.fn()
        end
        clock = target
        local keep = {}
        for _, t in ipairs(S.timers) do
            if not t.cancelled then keep[#keep + 1] = t end
        end
        S.timers = keep
    end

    function h:random(n)
        seed = (seed * 16807) % PM_MOD
        local r = seed / PM_MOD
        if n then return math.floor(r * n) + 1 end
        return r
    end

    ---------------------------------------------------------------- events
    function h:on(event, fn) return bus.on(event, fn) end
    function h:emit(event, payload) bus.emit(event, payload) end

    ---------------------------------------------------------------- identity, roster
    function h:me() return S.me end
    function h:normalize(name) return normalize(name) end
    function h:inRaid() return S.inRaid and #S.roster > 0 end
    function h:inGroup() return #S.roster > 0 end
    function h:roster() return copyList(S.roster) end

    function h:rankOf(name)
        name = normalize(name)
        for _, m in ipairs(S.roster) do
            if m.name == name then return m.rank end
        end
    end

    function h:guildRoster() return copyList(S.guild) end

    -- members: array of "Name" or { name, class, online }; o: leader, assistants, lootMethod, masterLooter.
    function h:setRaid(members, o)
        o = o or {}
        local assist = {}
        for _, a in ipairs(o.assistants or {}) do assist[normalize(a)] = true end
        local leader = o.leader and normalize(o.leader)
        S.roster = {}
        for i, m in ipairs(members) do
            local isTable = type(m) == "table"
            local name = normalize(isTable and m.name or m)
            S.roster[#S.roster + 1] = {
                name = name,
                class = (isTable and m.class) or "WARRIOR",
                rank = (name == leader and 2) or (assist[name] and 1) or 0,
                online = not (isTable and m.online == false),
                subgroup = math.floor((i - 1) / 5) + 1,
            }
        end
        S.inRaid = true
        local oldMethod = S.lootMethod
        if o.lootMethod then S.lootMethod = o.lootMethod end
        if o.masterLooter then S.masterLooter = normalize(o.masterLooter) end
        self:emit("roster.changed")
        if S.lootMethod ~= oldMethod then self:emit("lootMethod.changed", { method = S.lootMethod }) end
    end

    function h:setGuild(members)
        S.guild = {}
        for _, m in ipairs(members) do
            local isTable = type(m) == "table"
            S.guild[#S.guild + 1] = {
                name = normalize(isTable and m.name or m),
                class = (isTable and m.class) or "WARRIOR",
                online = not (isTable and m.online == false),
            }
        end
    end

    ---------------------------------------------------------------- loot
    function h:lootMethod() return S.lootMethod end
    function h:isMasterLooter() return S.lootMethod == "master" and S.masterLooter == S.me end

    local function openSlots()
        local out = {}
        for _, s in ipairs(S.loot.slots) do
            if not s.taken then
                out[#out + 1] = { slot = s.slot, link = s.link, itemId = s.itemId, quality = s.quality, quantity = s.quantity }
            end
        end
        return out
    end

    function h:lootSlots() return S.loot.open and openSlots() or {} end

    function h:candidates(slot)
        local s = S.loot.open and S.loot.slots[slot]
        if not s or s.taken then return nil, "gone" end
        return copyList(s.candidates)
    end

    function h:give(slot, name)
        if not self:isMasterLooter() then return false, "notml" end
        local s = S.loot.open and S.loot.slots[slot]
        if not s or s.taken then return false, "gone" end
        name = normalize(name)
        local ok = false
        for _, c in ipairs(s.candidates) do
            if c == name then ok = true; break end
        end
        if not ok then return false, "notcandidate" end
        s.taken = true
        self.given[#self.given + 1] = { slot = slot, link = s.link, to = name, t = clock }
        self:emit("loot.slotCleared", { slot = slot })
        if #openSlots() == 0 then
            S.loot.open = false
            self:emit("loot.closed")
        end
        return true
    end

    -- items: array of { link, itemId, quality, quantity, candidates } (candidates default to the raid).
    function h:dropLoot(items)
        S.loot = { open = true, slots = {} }
        for i, it in ipairs(items) do
            local cands = {}
            if it.candidates then
                for _, c in ipairs(it.candidates) do cands[#cands + 1] = normalize(c) end
            else
                for _, m in ipairs(S.roster) do cands[#cands + 1] = m.name end
            end
            S.loot.slots[i] = { slot = i, link = it.link, itemId = it.itemId, quality = it.quality or 4,
                quantity = it.quantity or 1, candidates = cands, taken = false }
        end
        self:emit("loot.opened", { slots = openSlots() })
    end

    function h:closeLoot()
        if S.loot.open then
            S.loot.open = false
            self:emit("loot.closed")
        end
    end

    function h:itemInfo(link)
        local info = S.items[link]
        if not info or S.pendingInfo[link] then return nil end
        local c = {}
        for k, v in pairs(info) do c[k] = v end
        return c
    end

    -- Register item data. With { delayed = true } itemInfo() returns nil until cacheItem(link).
    function h:setItemInfo(link, info, o)
        S.items[link] = info
        if o and o.delayed then S.pendingInfo[link] = true end
    end

    function h:cacheItem(link)
        S.pendingInfo[link] = nil
        self:emit("item.info", { link = link, itemId = tonumber(tostring(link):match("item:(%d+)")) })
    end

    ---------------------------------------------------------------- communication
    function h:registerPrefix(prefix)
        S.prefixes[prefix] = true
        return true
    end

    function h:send(prefix, payload, channel, target)
        if not self.caps.comms then return false, "nocomms" end
        if S.restricted then return false, "restricted" end
        if not S.prefixes[prefix] then return false, "noprefix" end
        if type(payload) ~= "string" then return false, "badpayload" end
        if #payload > self.maxMessage then return false, "toolong" end
        if not CHANNELS[channel] then return false, "badchannel" end
        if channel == "WHISPER" and not target then return false, "notarget" end
        local msg = { kind = "addon", prefix = prefix, payload = payload, channel = channel,
            target = target and normalize(target), from = S.me, t = clock }
        self.sent[#self.sent + 1] = msg
        if self.onSend then self.onSend(self, msg) end
        return true
    end

    function h:pending() return self.pendingCount end

    -- Simulate the client restricting outgoing addon messages (e.g. during a boss encounter).
    function h:setRestricted(flag)
        S.restricted = flag and true or false
        self:emit("comms.restrictionChanged", { restricted = S.restricted })
    end

    function h:whisper(name, text)
        self.sent[#self.sent + 1] = { kind = "whisper", target = normalize(name), text = text, from = S.me, t = clock }
        return true
    end

    function h:announce(text, channel)
        self.sent[#self.sent + 1] = { kind = "announce", channel = channel or "RAID", text = text, from = S.me, t = clock }
        return true
    end

    function h:serialize(t) return Hash.Canon(t) end
    function h:deserialize(str) return Hash.Decode(str) end

    function h:clearSent() self.sent = {} end

    -- The world talking to the client.
    function h:receive(prefix, payload, channel, sender)
        if not S.prefixes[prefix] then return false end
        self:emit("comms.received", { prefix = prefix, payload = payload, channel = channel, sender = normalize(sender) })
        return true
    end

    function h:whisperFrom(name, text)
        self:emit("whisper.received", { sender = normalize(name), text = text })
    end

    ---------------------------------------------------------------- trade
    function h:trade()
        if not S.trade then return nil end
        return { partner = S.trade.partner, give = copyList(S.trade.give), get = copyList(S.trade.get), accepted = S.trade.accepted }
    end

    function h:setTrade(t)
        S.trade = { partner = normalize(t.partner), give = t.give or {}, get = t.get or {}, accepted = t.accepted or false }
        self:emit("trade.changed", { trade = self:trade() })
    end

    function h:completeTrade(partner, gave, got)
        S.trade = nil
        self:emit("trade.closed", { completed = true, partner = normalize(partner), gave = gave or {}, got = got or {} })
    end

    function h:cancelTrade()
        S.trade = nil
        self:emit("trade.closed", { completed = false })
    end

    function h:setTradeable(link, seconds) S.tradeable[link] = clock + seconds end

    function h:tradeableUntil(link)
        local exp = S.tradeable[link]
        if exp and exp > clock then return exp - clock end
    end

    ---------------------------------------------------------------- environment
    function h:storage() return S.storage end
    function h:playSound(kind) self.sounds[#self.sounds + 1] = kind end
    function h:print(text) self.printed[#self.printed + 1] = text end
    function h:log(level, text) self.logs[#self.logs + 1] = { level = level, text = text } end

    function h:endEncounter(id, name, success)
        self:emit("encounter.ended", { id = id, name = name, success = success })
    end

    function h:enterWorld() self:emit("world.entered") end

    -- Simulate /reload: timers, handlers and prefix registrations vanish; storage, clock and
    -- the simulated world survive. The caller builds a fresh client over the same client.
    function h:reload()
        S.timers, S.prefixes = {}, {}
        bus.clear()
        return self
    end

    return h
end

end; chunk("KingsGambit", SK) end
-- ===== Engine.lua =====
do local chunk = function(...)
-- King's Gambit: an engine owns its ledger state and talks to the WoW client only through a Client.
-- No module-level state: tests and training can run many engines in one process.
local _, SK = ...
local M = SK:NewModule("Engine")
local Ledger = SK.modules.Ledger

local Engine = {}
Engine.__index = Engine

-- Build an engine over a Client. Persisted lists are loaded and fully verified; a list that
-- fails verification is reported in engine.problems and left untouched in storage
-- (never silently repaired or discarded).
-- opts.syncVerifyLimit (default 2000): lists up to this many events are fully hash-verified right
-- away; longer ones are loaded fast and verified in the background (see Engine:verifyTick).
function M.New(client, opts)
    local acct = client:storage().account
    acct.schema = acct.schema or 1
    acct.lists = acct.lists or {}
    acct.config = acct.config or {}
    local c = setmetatable({ client = client, db = acct, chains = {}, problems = {}, hooks = {}, verifying = {},
        verifyLimit = (opts and opts.syncVerifyLimit) or 2000, verifyBatch = (opts and opts.verifyBatch) or 100 }, Engine)
    for listId, rec in pairs(acct.lists) do
        local events = rec.events or {}
        local lazy = #events > c.verifyLimit
        local chain, err, idx
        if lazy then chain, err, idx = Ledger.LoadFast(listId, events) else chain, err, idx = Ledger.Load(listId, events) end
        if chain then
            rec.events = chain.events -- keep the saved table and the live chain in step
            c.chains[listId] = chain
            if lazy then c.verifying[listId] = chain end
        else
            c.problems[listId] = { reason = err, index = idx }
            client:print(("list '%s' failed verification at event %s: %s"):format(listId, tostring(idx), tostring(err)))
        end
    end
    if next(c.verifying) then
        c.verifyTimer = client:every(0.05, function() c:verifyTick() end)
    end
    return c
end

-- Background hash verification of large lists, a slice per tick so login never stalls. A list that
-- fails is reported and taken out of use (its saved data is left untouched).
function Engine:verifyTick()
    for listId, chain in pairs(self.verifying) do
        local status, idx = Ledger.VerifyStep(chain, self.verifyBatch)
        if status == "done" then
            self.verifying[listId] = nil
            self:fire("verified", listId, nil)
        elseif status == "bad" then
            self.verifying[listId] = nil
            self.chains[listId] = nil
            self.problems[listId] = { reason = "badhash", index = idx }
            self.client:print(("list '%s' failed verification at event %d: badhash"):format(listId, idx))
            self:fire("corrupt", listId, nil)
        end
        break -- one list per tick keeps each tick small
    end
    if not next(self.verifying) and self.verifyTimer then
        self.client:cancel(self.verifyTimer)
        self.verifyTimer = nil
    end
end

function Engine:IsVerified(listId) return self.chains[listId] ~= nil and self.verifying[listId] == nil end

function Engine:Get(listId) return self.chains[listId] end

-- Subscribe to changes: fn(kind, listId, event). kind is "local" (this engine wrote it),
-- "remote" (accepted from a peer) or "replaced" (a fork was resolved; event is nil).
-- Returns an unsubscribe function.
function Engine:OnChange(fn)
    local entry = { fn = fn, active = true }
    self.hooks[#self.hooks + 1] = entry
    return function() entry.active = false end
end

function Engine:fire(kind, listId, ev)
    local snapshot = {}
    for i, h in ipairs(self.hooks) do snapshot[i] = h end
    for _, h in ipairs(snapshot) do
        if h.active then h.fn(kind, listId, ev) end
    end
end

-- Create a list (writes its CreateList genesis event) and persist it.
function Engine:CreateList(listId, name)
    if self.chains[listId] or self.problems[listId] then return nil, "exists" end
    local chain = Ledger.NewChain(listId)
    local ev, err = Ledger.Append(chain, "CreateList", { name = name }, self.client:me(), self.client:serverTime())
    if not ev then return nil, err end
    self.chains[listId] = chain
    self.db.lists[listId] = { events = chain.events }
    self:fire("local", listId, ev)
    return chain
end

-- Author an event on a list as this engine, stamped with the Client's clock.
function Engine:Append(listId, type_, data)
    local chain = self.chains[listId]
    if not chain then return nil, "nolist" end
    local ev, err = Ledger.Append(chain, type_, data, self.client:me(), self.client:serverTime())
    if ev then self:fire("local", listId, ev) end
    return ev, err
end

-- Accept an event authored elsewhere. Returns "appended" | "duplicate", or nil + reason
-- (see Ledger.Receive; also "unknownlist" for a list we have never seen that does not start
-- with its CreateList). A list is adopted when its genesis event arrives.
function Engine:Receive(listId, ev)
    if self.problems[listId] then return nil, "corrupt" end
    local chain = self.chains[listId]
    local adopt = false
    if not chain then
        if type(ev) ~= "table" or ev.seq ~= 1 or ev.type ~= "CreateList" then return nil, "unknownlist" end
        chain, adopt = Ledger.NewChain(listId), true
    end
    local status, err = Ledger.Receive(chain, ev)
    if status == "appended" then
        if adopt then
            self.chains[listId] = chain
            self.db.lists[listId] = { events = chain.events }
        end
        self:fire("remote", listId, ev)
    end
    return status, err
end

-- Fork resolution: swap in a verified replacement chain. The events this engine had on the
-- losing branch are kept in db.orphans so an officer can review and re-enter them.
function Engine:ReplaceChain(listId, newChain, orphans)
    self.chains[listId] = newChain
    self.db.lists[listId] = { events = newChain.events }
    if orphans and #orphans > 0 then
        self.db.orphans = self.db.orphans or {}
        self.db.orphans[#self.db.orphans + 1] = { list = listId, at = self.client:serverTime(), events = orphans }
    end
    self:fire("replaced", listId, nil)
end

end; chunk("KingsGambit", SK) end
